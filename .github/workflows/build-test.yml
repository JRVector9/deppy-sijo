name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Format, boundary, and diff checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: xtask check-boundary
        run: cargo run --locked -p xtask -- check-boundary
      - name: git diff --check
        run: git diff --check

  build-test:
    name: Build, clippy, and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -p deppy-sijo --bin deppy-sijo -- -D warnings
        run: cargo clippy -p deppy-sijo --bin deppy-sijo --locked -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace --locked -- --test-threads=1
