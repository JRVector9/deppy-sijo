name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Format, boundary, and diff checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: xtask check-boundary
        run: cargo run --locked -p xtask -- check-boundary
      - name: git diff --check
        run: git diff --check

  build-test:
    name: Build, clippy, and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # 프로덕션 바이너리와 **테스트 코드까지** 함께 본다. --bin만 보면 테스트에
      # 쌓인 위반이 게이트를 통과해 계속 늘어난다(2026-08-11 정리 시점 4건이 쌓여
      # 있었고, 그중 하나는 #[test] 중복이라 테스트가 조용히 죽을 수 있는 종류였다).
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace --locked -- --test-threads=1
