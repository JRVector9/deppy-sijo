# Relay 신뢰 셸 릴리스. **현재는 publish가 차단된 상태다.**
#
# 셸 도메인·DNS·TLS edge·정적 호스트/CDN·배포 자격증명·GitHub 환경 이름이 아직 정해지지
# 않았다(deploy/relay-shell/README.md의 상태표). 그 좌표를 지어내는 대신, 불변 아티팩트와
# 사이드카 매니페스트까지만 만들고 publish 단계에서 **명시적으로 실패**한다 — 차단을 조용한
# 성공으로 바꾸지 않기 위해서다.
name: Relay shell release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 대상
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  build:
    name: Build and digest the trusted shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # 셸의 계약은 Rust 쪽 게이트가 쥐고 있다. 브라우저 게이트(#[ignore])는 Chrome이
      # 있는 러너에서만 의미가 있으므로 여기서는 소스 법칙·픽스처·배포 매니페스트를 본다.
      # `cargo test`의 자유 인자는 **하나뿐**이다(나머지는 하네스로 안 가고 cargo가 거부한다).
      # 두 integration 타깃은 각각 `--test <타깃명>`으로 지명한다. 타깃명은 파일명과 같으므로
      # `relay_webcrypto`가 아니라 `relay_webcrypto_vectors`다.
      - name: Gate on the shell contract tests
        run: |
          cargo test -p web-remote --locked \
            --test relay_shell_deploy --test relay_webcrypto_vectors \
            -- --test-threads=1
      # 오리진은 **환경 예제에서만** 온다. 워크플로가 도메인을 알고 있으면 그 순간
      # BLOCKED가 거짓이 된다.
      - name: Load the environment origins
        run: |
          set -eu
          env_file="deploy/relay-shell/${{ inputs.environment }}/shell.env.example"
          grep -E '^(SHELL_ORIGIN|RELAY_ORIGIN|RELAY_SHELL_DIST)=' "$env_file" >> "$GITHUB_ENV"
      - name: Build the immutable artifact and its sidecar manifest
        run: sh web/relay-shell/build.sh
      # 방금 만든 아카이브를 풀어 아카이브·파일별·크립토 모듈 다이제스트를 되대조한다.
      - name: Verify the artifact against its own manifest
        run: sh web/relay-shell/build.sh verify
      - uses: actions/upload-artifact@v4
        with:
          name: relay-shell-${{ inputs.environment }}
          path: |
            ${{ env.RELAY_SHELL_DIST }}/relay-shell-*.tar.gz
            ${{ env.RELAY_SHELL_DIST }}/relay-shell.manifest.json
          if-no-files-found: error

  publish:
    name: Publish (BLOCKED)
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 좌표가 생기면 이 단계를 실제 publish로 교체한다. 그전까지는 실패가 정답이다 —
      # 성공으로 표시되면 "배포됨"이라는 잘못된 신호가 남는다.
      - name: Refuse to publish without resolved coordinates
        run: |
          echo "Relay shell publish is BLOCKED."
          echo "Unresolved: shell staging and production domains, shell DNS owner, shell TLS"
          echo "edge, static host/CDN and its access control, response-header injection point,"
          echo "immutable artifact registry, GitHub environment and secret names, deploy"
          echo "credentials, and the trusted Relay origin constant."
          echo "See deploy/relay-shell/README.md for the status table."
          exit 1
