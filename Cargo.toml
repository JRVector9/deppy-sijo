# v2.5 설계문서 1.8 확정 버전 기준. patch는 Cargo.lock으로 고정.
[workspace]
resolver = "3"
members = [
    "crates/platform",
    "crates/app",
    "crates/audit",
    "crates/auth",
    "crates/core",
    "crates/mcp",
    "crates/mcp-proxy",
    "crates/mux",
    "crates/persist",
    "crates/pty",
    "crates/runtime",
    "crates/secret",
    "crates/session",
    "crates/storage",
    "crates/terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = "0.35"
egui = "0.35"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
notify-rust = "4"
toml = "0.9"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.9"
alacritty_terminal = "0.26"
unicode-normalization = "0.1"
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
uuid = { version = "1", features = ["v4"] }
# OAuth PKCE (설계 crate 정책 §oauth2 = "5"). reqwest/tokio 회피 — sync ureq client만
oauth2 = { version = "5", default-features = false, features = ["ureq"] }
ureq = "2"
sha2 = "0.10"
chacha20poly1305 = "0.10"
# remote 바이너리 프레이밍 (PR-19 v1+ — JSON Vec<u8> 팽창 해소)
postcard = { version = "1", default-features = false, features = ["use-std"] }
