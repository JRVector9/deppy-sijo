# v2.5 설계문서 1.8 확정 버전 기준. patch는 Cargo.lock으로 고정.
[workspace]
resolver = "3"
members = [
    "crates/agent-mcp",
    "crates/connector-contract",
    "crates/connector-service",
    "crates/connector-ui",
    "crates/platform",
    "crates/app",
    "crates/audit",
    "crates/auth",
    "crates/core",
    "crates/i18n",
    "crates/http-client",
    "crates/mcp",
    "crates/mcp-proxy",
    "crates/mcp-store",
    "crates/mux",
    "crates/persist",
    "crates/pty",
    "crates/relay-protocol",
    "crates/relay-server",
    "crates/runtime",
    "crates/secret",
    "crates/session",
    "crates/storage",
    "crates/storage-core",
    "crates/terminal",
    "crates/web-remote",
    "xtask",
]
# vendored fork는 워크스페이스 멤버가 아니다(patch로만 주입). exclude가 있어야 그
# 크레이트를 --manifest-path로 독립 테스트할 수 있다(자체 alacritty 테스트 스위트 실행용).
exclude = ["third_party/alacritty_terminal-0.26.0"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 기본 feature의 wgpu/Metal만 production에 포함한다. Glow/OpenGL A/B 벤치는 app의
# `render-glow` feature가 필요할 때만 추가해 일반 배포의 코드/프레임워크 매핑을 줄인다.
# default-features를 끄는 이유: eframe의 default가 `winit/default`를 켜고, 그게
# wayland-csd-adwaita → sctk-adwaita → ab_glyph → owned_ttf_parser → ttf-parser를
# 끌어온다(RUSTSEC-2026-0192, 수정판 없음). x11/wayland/web_screen_reader와 함께
# 전부 리눅스·wasm 전용이라 macOS 빌드에는 쓰이지 않으면서 감사 그래프만 오염시킨다.
# 리눅스 GUI를 지원하려면 "wayland", "x11", "winit/default"를 다시 켜야 한다.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    # 공지 등 ctx.open_url 요청을 OS 기본 브라우저로 전달한다.
    "links",
    "wgpu",
] }
egui = "0.36"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
syn = { version = "3", features = ["full"] }
quote = "1"
regex = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
notify-rust = "4"
toml = "1.1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
i18n = { path = "crates/i18n" }
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.9"
alacritty_terminal = "0.26"
unicode-normalization = "0.1"
rcgen = "0.14"
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
uuid = { version = "1", features = ["v4"] }
# 파일 트리 (docs/file-tree-design.md): 휴지통 삭제(FT-3) / FSEvents 감시(FT-4) /
# macOS renamex_np(RENAME_EXCL) 덮어쓰기 금지 rename(FT-2 §9-5)
trash = "5"
notify = "8"
libc = "0.2"
# OAuth PKCE (설계 crate 정책 §oauth2 = "5"). reqwest/tokio 회피 — sync ureq client만
oauth2 = { version = "5", default-features = false }
# The shared idle transport uses ureq's unversioned connector API.
ureq = "=3.4.0"
http-client = { path = "crates/http-client" }
sha2 = "0.11"
chacha20poly1305 = "0.11"
# remote 바이너리 프레이밍 (PR-19 v1+ — JSON Vec<u8> 팽창 해소)
postcard = { version = "1", default-features = false, features = ["use-std"] }
# remote TLS (단계 C-2). ring provider 명시 — aws-lc-rs 회피(Windows NASM/CMake 마찰, 설계 §2.1).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
# 모바일 PWA (v3.3 P1): QR 페어링 — 설정 UI가 접속 URL을 egui 텍스처로 렌더 (image 기능 불필요)
qrcode = { version = "0.14", default-features = false }
# 모바일 PWA WS API (v3.3 P2 예정) — sync tungstenite. P1은 워크스페이스 등록만, 실사용 없음
tungstenite = { version = "0.30", default-features = false }
# 글로벌 할당자 — scrollback 압축이 해제한 셀 배열 페이지를 OS로 실제 반환해
# macOS phys_footprint(활성 상태 보기 메모리)를 떨어뜨린다. jemalloc은 Windows/MSVC
# 미지원이라 배제, mimalloc은 macOS+Windows/MSVC 크로스플랫폼. libmimalloc-sys는
# mi_collect/mi_option_set 런타임 제어용(mimalloc 크레이트와 같은 네이티브 lib을 공유).
mimalloc = "0.1"
# extended = mi_collect/mi_option_* FFI 노출(강제 purge용). override 미사용 —
# libc malloc을 가로채지 않아 System 할당 경로가 mimalloc과 독립적으로 남는다(합성 baseline 대조).
libmimalloc-sys = { version = "0.1", features = ["extended"] }

# eframe 0.36 resolves winit 0.30.13. Keep that stable API while carrying the
# minimal macOS Korean-IME fix from rust-windowing/winit#4478; see the vendored
# DEPPY_BACKPORT.md for the upstream commit and removal criteria.
[patch.crates-io]
winit = { path = "third_party/winit-0.30.13" }
# 스크롤백 라인 압축(옵션 D) 구현을 위해 vendor. 코덱/저장은 이 포크 내부에만 두고
# alacritty 타입은 crates/terminal 밖으로 노출하지 않는다. third_party/.../DEPPY_VENDOR.md 참조.
alacritty_terminal = { path = "third_party/alacritty_terminal-0.26.0" }
