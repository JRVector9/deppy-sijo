# v2.5 설계문서 1.8 확정 버전 기준. patch는 Cargo.lock으로 고정.
[workspace]
resolver = "3"
members = [
    "crates/connector-contract",
    "crates/connector-service",
    "crates/connector-ui",
    "crates/platform",
    "crates/app",
    "crates/audit",
    "crates/auth",
    "crates/core",
    "crates/i18n",
    "crates/mcp",
    "crates/mcp-proxy",
    "crates/mcp-store",
    "crates/mux",
    "crates/persist",
    "crates/pty",
    "crates/runtime",
    "crates/secret",
    "crates/session",
    "crates/storage",
    "crates/storage-core",
    "crates/terminal",
    "crates/web-remote",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 기본 feature의 wgpu/Metal만 production에 포함한다. Glow/OpenGL A/B 벤치는 app의
# `render-glow` feature가 필요할 때만 추가해 일반 배포의 코드/프레임워크 매핑을 줄인다.
eframe = "0.35"
egui = "0.35"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
quick-xml = { version = "0.39", features = ["serialize"] }
notify-rust = "4"
toml = "1.1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
i18n = { path = "crates/i18n" }
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.9"
alacritty_terminal = "0.26"
unicode-normalization = "0.1"
rcgen = "0.13"
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
uuid = { version = "1", features = ["v4"] }
# 파일 트리 (docs/file-tree-design.md): 휴지통 삭제(FT-3) / FSEvents 감시(FT-4) /
# macOS renamex_np(RENAME_EXCL) 덮어쓰기 금지 rename(FT-2 §9-5)
trash = "5"
notify = "8"
libc = "0.2"
# OAuth PKCE (설계 crate 정책 §oauth2 = "5"). reqwest/tokio 회피 — sync ureq client만
oauth2 = { version = "5", default-features = false, features = ["ureq"] }
ureq = "2"
sha2 = "0.10"
chacha20poly1305 = "0.10"
# remote 바이너리 프레이밍 (PR-19 v1+ — JSON Vec<u8> 팽창 해소)
postcard = { version = "1", default-features = false, features = ["use-std"] }
# remote TLS (단계 C-2). ring provider 명시 — aws-lc-rs 회피(Windows NASM/CMake 마찰, 설계 §2.1).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
# 모바일 PWA (v3.3 P1): QR 페어링 — 설정 UI가 접속 URL을 egui 텍스처로 렌더 (image 기능 불필요)
qrcode = { version = "0.14", default-features = false }
# 모바일 PWA WS API (v3.3 P2 예정) — sync tungstenite. P1은 워크스페이스 등록만, 실사용 없음
tungstenite = { version = "0.29", default-features = false }

# eframe 0.35 resolves winit 0.30.13. Keep that stable API while carrying the
# minimal macOS Korean-IME fix from rust-windowing/winit#4478; see the vendored
# DEPPY_BACKPORT.md for the upstream commit and removal criteria.
[patch.crates-io]
winit = { path = "third_party/winit-0.30.13" }
