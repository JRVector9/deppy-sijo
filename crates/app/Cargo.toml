[package]
name = "deppy-sijo"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# LibGhosttyBackend A/B 실측용 (실행 시 DEPPY_TERM_BACKEND=ghostty로 선택) —
# 빌드에 Zig 필요. 기본 빌드에는 포함하지 않는다.
ghostty-backend = ["terminal/ghostty-backend"]

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
i18n = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }
# 모바일 웹 페어링 QR (mobile-pwa v3.3 P1) — 접속 URL을 egui 텍스처로 렌더
qrcode = { workspace = true }
# 프로젝트 폴더 선택 네이티브 다이얼로그 (환경 메뉴 — 워크스페이스 path 지정, 2026-07-08)
rfd = "0.15"
audit = { path = "../audit" }
auth = { path = "../auth" }
mcp = { path = "../mcp" }
mcp-store = { path = "../mcp-store" }
persist = { path = "../persist" }
platform = { path = "../platform" }
runtime = { path = "../runtime" }
secret = { path = "../secret" }
storage = { path = "../storage" }
terminal = { path = "../terminal" }
web-remote = { path = "../web-remote" }

# 파일 트리 사이드바 (docs/file-tree-design.md)
trash = { workspace = true }
notify = { workspace = true }
toml_edit = "0.25.12"

[target.'cfg(target_os = "macos")'.dependencies]
# renamex_np(RENAME_EXCL) — 덮어쓰기 금지 rename (§9-5 TOCTOU 회피)
libc = { workspace = true }
muda = "0.17"
# 클립보드 PNG 바이트 직행(디코드/재인코딩 없이 파일로 — cmux 방식, 2026-07-08).
# eframe/winit이 이미 쓰는 crate라 추가 빌드 비용 미미.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
