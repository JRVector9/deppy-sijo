[package]
name = "deppy-sijo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# LibGhosttyBackend A/B 실측용 (실행 시 DEPPY_TERM_BACKEND=ghostty로 선택) —
# 빌드에 Zig 필요. 기본 빌드에는 포함하지 않는다.
ghostty-backend = ["terminal/ghostty-backend"]
# 렌더러 A/B 실측(B1)의 프레임 alloc 카운터 — counting GlobalAlloc을 심는다.
# **기본 빌드에는 코드 자체가 없다**(cfg로 통째 제외) — 평소 실행 비용 0.
bench-alloc = []
# Glow/OpenGL 렌더러 A/B 벤치 전용. production/package 빌드에는 포함하지 않는다.
render-glow = ["eframe/glow"]

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
pty = { path = "../pty" }
quick-xml = { workspace = true }
# AI 서비스 상태 피드(status_feed) + 로컬 LLM 감지(local_llm) — sync ureq만
# (tokio 금지 관례, auth/mcp/web-remote와 동일 클라이언트).
ureq = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
i18n = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }
# 모바일 웹 페어링 QR (mobile-pwa v3.3 P1) — 접속 URL을 egui 텍스처로 렌더
qrcode = { workspace = true }
# 프로젝트 폴더 선택 네이티브 다이얼로그 (환경 메뉴 — 워크스페이스 path 지정, 2026-07-08)
rfd = "0.17"
# macOS 드래그&드롭/파일 피커 경로가 NFD(자소분해)로 넘어오는 문제 — composer.rs
# mention_path에서 NFC로 정규화한다 (terminal 크레이트 alacritty_backend.rs
# composed_char와 동일 정책, 2026-08-14).
unicode-normalization = { workspace = true }
audit = { path = "../audit" }
auth = { path = "../auth" }
connector-contract = { path = "../connector-contract" }
connector-service = { path = "../connector-service" }
connector-ui = { path = "../connector-ui" }
deppy-core = { path = "../core" }
mcp = { path = "../mcp" }
mcp-store = { path = "../mcp-store" }
persist = { path = "../persist" }
platform = { path = "../platform" }
runtime = { path = "../runtime" }
secret = { path = "../secret" }
storage = { path = "../storage" }
terminal = { path = "../terminal" }
web-remote = { path = "../web-remote" }

# 파일 트리 사이드바 (docs/file-tree-design.md)
trash = { workspace = true }
notify = { workspace = true }
toml_edit = "0.25.12"

# 글로벌 할당자 (crates/app/src/alloc.rs) — 해제 페이지를 OS로 반환해 phys_footprint 하락.
# bench-alloc feature에서는 bench.rs의 counting 할당자가 대신 설치되므로 이 두 크레이트는
# 링크되지 않는다(같은 프로세스에 #[global_allocator]는 하나만 가능). libmimalloc-sys는
# mi_collect/mi_option_set 런타임 제어용.
mimalloc = { workspace = true }
libmimalloc-sys = { workspace = true }

# libc는 unix 전체에 필요하다. 코드가 `#[cfg(unix)]`로 들어가는데(waitid, mkfifo,
# O_NOFOLLOW 등 POSIX API) 의존성만 macOS로 좁혀 두면 Linux에서 크레이트를 찾지
# 못해 컴파일이 깨진다 — 실증(2026-08-03): Ubuntu에서 `cannot find crate libc`
# 40건. `pty`/`mcp-proxy`는 처음부터 `cfg(unix)`로 잡고 있다.
# Darwin 전용 API(renamex_np, proc_pid_rusage, sysctlbyname)를 쓰는 자리는 모두
# `#[cfg(target_os = "macos")]`로 따로 막혀 있어 이 확장에 영향받지 않는다.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# 메모리 압박 감지 (로드맵 C1) — rfd가 이미 쓰는 crate라 추가 빌드 비용 없음.
dispatch2 = "0.3"
# default = ["libxdo", "gtk"]. 두 의존 모두 리눅스 타깃 게이팅이지만 feature 해석은
# 타깃과 무관해 락파일에 gtk3 사슬 전체(gtk/atk/gdk/gio/pango/glib/proc-macro-error)가
# 들어온다 — RUSTSEC-2024-0412/0413/0415/0416/0418/0419/0420/0429, 0370. muda 0.19.3이
# 최신이라 버전으로는 못 푼다. macOS 메뉴 백엔드는 이 feature들이 필요 없다.
muda = { version = "0.19.3", default-features = false }
# 상단바 신호등(닫기/최소화/전체화면) 수직 재배치 — eframe이 이미 쓰는 winit을
# 직접 참조해 CreationContext::winit_window()에 WindowExtMacOS를 쓴다
# (third_party/winit-0.30.13 patch, 2026-07-25).
# eframe이 winit에 요청하는 것과 같은 최소 조합. default를 받으면 x11/wayland/
# wayland-csd-adwaita가 켜져 ttf-parser가 딸려온다(위 eframe 주석 참고).
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# 클립보드 PNG 바이트 직행(디코드/재인코딩 없이 파일로 — cmux 방식, 2026-07-08).
# eframe/winit이 이미 쓰는 crate라 추가 빌드 비용 미미.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSEvent",
    "NSPasteboard",
    # 파일 드래그 중 winit이 포인터를 안 줘(draggingUpdated 미구현) NSEvent
    # mouseLocation을 창 좌표로 환산할 때 primary 스크린 프레임이 필요 (2026-07-19).
    "NSScreen",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSString",
    # 파일 트리 「복사」 — NSPasteboard writeObjects에 파일 URL 배열을 쓴다 (2026-07-19).
    "NSArray",
    "NSURL",
] }
# MainThreadMarker(NSScreen 조회)·ProtocolObject(NSPasteboardWriting 배열) 등
# objc2 코어 타입 직접 사용 (2026-07-19).
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# egui 공식 테스트 하네스 — AccessKit 트리로 버튼/입력을 찾아 실제 클릭·타이핑을
# 시뮬레이션한다(인박스 카드 상호작용 자동 검증, 2026-07-17). 렌더 백엔드 불필요.
egui_kittest = "0.35"
