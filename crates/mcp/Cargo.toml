# PR-15 Local MCP Manager (설계문서 §1.5, §11.4-11.5).
# stdio JSON-RPC MCP: initialize / tools/list. stdout는 valid MCP만, stderr는 capture+redaction.
# 앱 마이그레이션 통합·UI 배선은 crates/app에서 (이 crate는 프로토콜/매니저 로직 + DDL 상수).
[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
deppy-core = { path = "../core" }
secret = { path = "../secret" }
# Streamable HTTP transport (H2) — sync ureq만 사용 (tokio 금지 관례)
ureq = { workspace = true }
# 수동 redirect의 Location 해석·same-origin 비교·URL 정책 검증.
# ureq 2가 이미 의존하는 crate(재노출은 안 함) — 새 lock 항목 없음.
url = "2"

# 종료 시 process group 정리(killpg)용 — pty crate와 동일 관행
[target.'cfg(unix)'.dependencies]
libc = "0.2"
