# 모바일 PWA용 내장 웹서버 (mobile-pwa v3.3 PR-P1/P2). 의존 최소 원칙 —
# HTTP는 수제(프레임워크 없음), 랜덤은 uuid v4(remote.rs 토큰 관례), 토큰 영속은 secret.
# P2: WS는 sync tungstenite(handshake 기능만 — TLS 기본기능은 off, 종단은 tailscale/cert).
# 대시보드는 runtime 이벤트 구독 + storage Db 직행(승인) — 두 상위 계층에만 의존.
[package]
name = "web-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
deppy-core = { path = "../core" }
secret = { path = "../secret" }
# P2 대시보드: 활성 workspace worker 이벤트 구독(subscribe_with_wake) + 승인 DB 직행.
runtime = { path = "../runtime" }
storage = { path = "../storage" }
# WS JSON 프로토콜(브라우저 친화) — postcard 바이너리는 데스크톱 원격 전용으로 유지.
serde = { workspace = true }
serde_json = { workspace = true }
# sync WebSocket. default-features=false(TLS off)에 handshake만 켜 derive_accept_key 사용.
tungstenite = { workspace = true, features = ["handshake"] }
# P4 웹푸시 암호 스택 — RustCrypto **sync** 계열만(tokio/async 크레이트 금지). VAPID JWT(ES256)와
# RFC 8291 ECDH(P-256)에 p256, HKDF-SHA256에 hkdf, aes128gcm 레코드에 aes-gcm, base64url 인코딩에
# base64. sha2/ureq는 워크스페이스 lock 기존(HKDF의 SHA-256, 발송 POST). 엔트로피는 getrandom(sync).
# 기존 web-push 크레이트는 hyper(async) 의존이라 배제 — 여기 수제 구현(RFC 8291/8292 벡터로 검증).
p256 = { version = "0.14", features = ["ecdh"] }
hkdf = "0.13"
aes-gcm = { version = "0.11", features = ["zeroize"] }
# Force zeroizing Drop implementations for AES/GHASH schedules and HKDF's HMAC/SHA state.
# These direct dependencies intentionally unify features used behind aes-gcm/hkdf.
aes = { version = "0.9", features = ["zeroize"] }
ghash = { version = "0.6", features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
zeroize = "1"
base64 = "0.22"
getrandom = "0.4"
sha2 = { workspace = true, features = ["zeroize"] }
ureq = { workspace = true }
# Relay pairing rendezvous secrets require an explicit constant-time equality primitive.
subtle = "2"
