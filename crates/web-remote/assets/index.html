<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>시조새 — Deppy Sijo</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- iOS 설치형(홈 화면 추가) 표시 — standalone 실행 + 상태바 스타일 + 앱 이름 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="시조새">
  <!-- 자산 경로에 셸 버전 해시가 주입된다(static_srv). 구 Service Worker의 캐시 목록에
       없는 경로라 반드시 네트워크에서 받아온다 — HTML(network-first)과 JS/CSS 버전 불일치
       (새 화면 + 옛 스크립트) 방지. -->
  <link rel="stylesheet" href="/app.__SHELL_VERSION__.css">
</head>
<body data-view="shell">
  <main class="app">
    <header class="brand">
      <img src="/icon-192.png" alt="" width="36" height="36">
      <h1>시조새</h1>
      <p class="status"><span id="dot" class="dot"></span> <span id="status-text">연결 중…</span></p>
    </header>

    <!-- iOS 설치 안내: beforeinstallprompt가 없어 공유시트 수동 안내를 띄운다.
         app.js가 iOS Safari && !standalone일 때만 표시하고, 닫으면 localStorage로 억제한다. -->
    <div id="ios-install" class="ios-hint" hidden>
      <button id="ios-install-close" class="hint-close" type="button" aria-label="닫기">✕</button>
      <p class="hint-title">홈 화면에 설치</p>
      <p>Safari 공유 메뉴에서 “홈 화면에 추가”를 선택하면 앱처럼 실행됩니다.</p>
      <p class="hint-sub">설치형은 저장소가 분리돼 페어링이 한 번 더 필요할 수 있습니다.</p>
    </div>

    <!-- 알림 권한 유도: iOS 설치형 앱 아이콘 뱃지·푸시는 알림 권한 승인 후에만 동작한다.
         app.js가 권한 미결정일 때만 노출한다. P4에서 웹푸시 구독과 같은 제스처로 통합될 자리. -->
    <button id="notify-enable" class="notify-enable" type="button" hidden>알림 켜기 — 승인 뱃지·푸시</button>

    <!-- 킬러 기능: 승인 대시보드. 카드의 미리보기/서버/도구는 모두 textContent로만 삽입한다. -->
    <section class="panel" aria-labelledby="approvals-title">
      <h2 id="approvals-title">승인 대기 <span id="approvals-count" class="count">0</span></h2>
      <div id="approvals" class="cards"></div>
      <p id="approvals-empty" class="empty">대기 중인 승인이 없습니다.</p>
    </section>

    <!-- 터미널 뷰어(P5d): 세션의 "보기"로 열린다. 읽기 전용 + 최소 제어(Ctrl-C/Enter)만. -->
    <section id="viewer" class="panel viewer" aria-labelledby="viewer-title" hidden>
      <h2 id="viewer-title">화면 <span id="viewer-session" class="count"></span></h2>
      <div class="viewer-wrap"><canvas id="viewer-canvas"></canvas></div>
      <!-- 스크롤백 열람 중 표시 — 터치/휠로 과거를 보는 동안만 나타난다 -->
      <div id="viewer-scroll-note" class="viewer-scroll-note" hidden>
        <span id="viewer-offset-text"></span>
        <button id="viewer-bottom" type="button">맨 아래로</button>
      </div>
      <!-- 특수키 행 (P6b): composer를 거치지 않고 즉시 전송 — claude code 메뉴 선택(↑↓+Enter)이
           폰에서 되는 것이 핵심 사용례. 제어 시퀀스는 서버 화이트리스트가 생성한다. -->
      <div class="viewer-keys">
        <button type="button" data-key="esc">Esc</button>
        <button type="button" data-key="tab">Tab</button>
        <button type="button" data-key="up">↑</button>
        <button type="button" data-key="down">↓</button>
        <button type="button" data-key="left">←</button>
        <button type="button" data-key="right">→</button>
        <button type="button" data-key="ctrl_c">Ctrl‑C</button>
        <button type="button" data-key="ctrl_d">Ctrl‑D</button>
        <button type="button" data-key="enter">Enter</button>
      </div>

      <!-- composer (P6b): textarea라 브라우저가 한글 IME 조합을 네이티브로 처리한다.
           Enter는 줄바꿈, 전송은 버튼(모바일 오전송 방지). 데스크톱은 Cmd/Ctrl-Enter.
           첨부(P6d): 파일 선택 → POST /upload → 응답 경로를 textarea에 삽입. accept는
           UX 힌트일 뿐 — 실제 검증은 서버 Content-Type 화이트리스트가 한다. -->
      <div class="composer">
        <input id="composer-file" type="file" hidden
               accept="image/png,image/jpeg,image/gif,image/webp,image/heic,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.md">
        <button id="composer-attach" type="button" class="composer-attach" aria-label="파일 첨부">📎</button>
        <textarea id="composer-text" rows="1" placeholder="메시지 입력…"
                  autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
        <button id="composer-send" type="button">전송</button>
      </div>
      <p id="composer-note" class="composer-note" hidden></p>

      <div class="viewer-actions">
        <button id="viewer-close" type="button" class="viewer-close">닫기</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="sessions-title">
      <h2 id="sessions-title">세션</h2>
      <ul id="sessions" class="sessions"></ul>
      <p id="sessions-empty" class="empty">활성 세션이 없습니다.</p>
      <p id="resource" class="resource"></p>
    </section>
  </main>
  <script src="/app.__SHELL_VERSION__.js"></script>
</body>
</html>
