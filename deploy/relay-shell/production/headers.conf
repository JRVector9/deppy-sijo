# Deppy Relay 신뢰 셸 — production 응답 헤더.
#
# 정적 호스트가 셸의 모든 응답에 이 헤더를 붙여야 한다. 문서 안 <meta> CSP는 보조일 뿐이고
# **응답 헤더가 권위다** — meta는 frame-ancestors를 강제하지 못한다.
#
# 값의 CSP는 build.sh가 매니페스트에 적는 `content_security_policy`와 한 글자도 달라선
# 안 된다. RELAY_ORIGIN은 shell.env.example의 값과 같다.

Content-Security-Policy: default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src wss://relay.example.invalid; manifest-src 'self'; worker-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; upgrade-insecure-requests

# 셸은 다른 오리진에 끼워 넣을 수 없다. CSP frame-ancestors와 겹치는 방어다.
X-Frame-Options: DENY
X-Content-Type-Options: nosniff
Referrer-Policy: no-referrer

# 셸은 카메라·마이크·위치를 쓰지 않는다. 쓰게 되면 그건 별도 검토 대상이다.
Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()

# 셸 오리진은 HSTS 대상이다. 프리로드 등록은 도메인 소유자가 정해진 뒤에 판단한다.
Strict-Transport-Security: max-age=63072000; includeSubDomains

# 진입 문서와 서비스워커는 캐시하지 않는다. 버전 있는 자산만 불변 캐시한다 —
# 이 규칙이 없으면 옛 셸이 새 프로토콜을 조용히 약화시킨 채 살아남는다.
# /            Cache-Control: no-store
# /index.html  Cache-Control: no-store
# /sw.js       Cache-Control: no-store
# /v/<digest>/ Cache-Control: public, max-age=31536000, immutable
