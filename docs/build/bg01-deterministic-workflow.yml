# Pending installation at `.github/workflows/bg01-deterministic.yml` by credentials with the
# GitHub `workflow` scope. Kept outside `.github/workflows` so the source/gate checkpoint can be
# pushed by the current least-privilege OAuth credential.
name: BG01 deterministic gate

on:
  pull_request:
  push:
    branches: [main, codex/connector-refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bg01-deterministic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Boundary, security, failure, and regression gates
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      # actions/checkout v4.2.2; pin executable supply-chain code, not a mutable tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run BG01 deterministic gate
        run: cargo run --locked -p xtask -- bg01-deterministic-gate
