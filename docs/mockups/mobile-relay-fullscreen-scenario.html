<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181b20">
  <title>Deppy Sijo — Tailscale 공존 모바일 연결 시나리오</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #181b20;
      --surface: #20242a;
      --surface-2: #0f1115;
      --surface-3: #15181d;
      --border: #32363e;
      --border-strong: #454b55;
      --text: #dcdee2;
      --text-strong: #f3f5f7;
      --muted: #828893;
      --muted-2: #a8adb6;
      --cyan: #39b8e8;
      --green: #56d364;
      --amber: #e0a43a;
      --red: #ef6671;
      --blue: #58a6ff;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    button, input, textarea { font: inherit; }
    button { min-height: 44px; }
    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .prototype-shell {
      min-height: 100vh;
      padding: max(22px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }

    .prototype-header {
      max-width: 1360px;
      margin: 0 auto 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    .prototype-header h1 {
      margin-bottom: 4px;
      color: var(--text-strong);
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 720;
      letter-spacing: -0.025em;
    }

    .prototype-header p:last-child { margin: 0; color: var(--muted-2); }
    .prototype-badge {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid #28566a;
      color: #8fd9f5;
      background: #14262e;
      font-size: 12px;
      font-weight: 650;
    }

    .prototype-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 3px rgba(57, 184, 232, 0.14);
    }

    .flow-rail {
      max-width: 1360px;
      margin: 0 auto 18px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border: 1px solid var(--border);
      background: var(--surface-3);
      overflow-x: auto;
    }

    .flow-step {
      position: relative;
      border: 0;
      border-right: 1px solid var(--border);
      border-radius: 0;
      padding: 10px 12px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      min-width: 130px;
    }

    .flow-step:last-child { border-right: 0; }
    .flow-step:hover { background: #1d2127; color: var(--text); }
    .flow-step[aria-current="step"] { background: #172630; color: var(--text-strong); }
    .flow-step[aria-current="step"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--cyan);
    }

    .flow-index {
      display: block;
      margin-bottom: 3px;
      color: var(--cyan);
      font: 700 10px/1 ui-monospace, Menlo, monospace;
      letter-spacing: 0.08em;
    }

    .flow-label { font-size: 12px; font-weight: 640; white-space: nowrap; }

    .stage-switcher {
      display: none;
      max-width: 620px;
      margin: 0 auto 12px;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
      padding: 3px;
      background: var(--surface-3);
    }

    .stage-switcher button {
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .stage-switcher button.is-active { background: #25303a; color: var(--text-strong); }

    .scenario-stage {
      max-width: 1360px;
      min-height: 680px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(590px, 1.55fr) minmax(330px, 0.7fr);
      gap: 30px;
      align-items: stretch;
    }

    .device-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.03em;
    }

    .device-caption strong { color: var(--text); font-size: 13px; }
    .device-status { display: inline-flex; align-items: center; gap: 7px; }
    .device-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

    .desktop-wrap, .phone-wrap { min-width: 0; display: flex; flex-direction: column; }
    .desktop-frame {
      flex: 1;
      min-height: 630px;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      box-shadow: var(--shadow);
    }

    .window-chrome {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      background: #24282e;
    }

    .traffic { width: 10px; height: 10px; border-radius: 50%; background: #555b64; }
    .window-title { margin-left: 8px; color: var(--muted-2); font-size: 12px; }

    .desktop-body { height: calc(100% - 42px); display: grid; grid-template-columns: 190px minmax(0, 1fr); }
    .settings-nav { padding: 18px 10px; border-right: 1px solid var(--border); background: #171a1f; }
    .nav-brand { display: flex; align-items: center; gap: 9px; margin: 0 9px 22px; color: var(--text-strong); font-weight: 700; }
    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      color: #071116;
      background: var(--cyan);
      font: 900 14px/1 ui-monospace, monospace;
    }

    .settings-nav button {
      width: 100%;
      min-height: 44px;
      padding: 0 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }

    .settings-nav button.is-active { color: var(--text-strong); background: #242a31; }
    .settings-content { padding: clamp(24px, 5vw, 52px); overflow: auto; }
    .settings-kicker { margin-bottom: 7px; color: var(--muted); font-size: 12px; }
    .settings-content h2 { margin-bottom: 8px; color: var(--text-strong); font-size: 24px; letter-spacing: -0.02em; }
    .settings-lead { max-width: 660px; margin-bottom: 26px; color: var(--muted-2); }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 17px 0;
      border-top: 1px solid var(--border);
    }

    .settings-row:last-of-type { border-bottom: 1px solid var(--border); }
    .row-title { margin-bottom: 3px; color: var(--text-strong); font-weight: 650; }
    .row-copy { margin: 0; color: var(--muted); font-size: 12px; }
    .transport-options { margin-top: 20px; border-top: 1px solid var(--border); }
    .transport-option {
      width: 100%;
      min-height: 72px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .transport-option:hover { background: #1d2228; }
    .transport-option.is-selected { background: #172630; }
    .transport-radio { width: 16px; height: 16px; border: 1px solid #606873; border-radius: 50%; }
    .transport-option.is-selected .transport-radio { border: 5px solid var(--cyan); }
    .transport-option strong { display: block; color: var(--text-strong); }
    .transport-option small { display: block; margin-top: 3px; color: var(--muted); }
    .transport-tag { min-height: 22px; display: inline-flex; align-items: center; padding: 0 7px; border: 1px solid var(--border-strong); color: var(--muted-2); font-size: 10px; font-weight: 700; }
    .transport-tag.new { border-color: #2b5d70; background: #172933; color: #91d9f2; }
    .transport-groups { display: grid; gap: 18px; margin-top: 20px; }
    .transport-group { border: 1px solid var(--border); padding: 0 14px; }
    .transport-group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; border-bottom: 1px solid var(--border); }
    .transport-group-head strong { color: var(--text-strong); font-size: 12px; }
    .transport-group-head span { color: var(--muted); font-size: 10px; }
    .transport-tabs { display: flex; gap: 0; margin: 0 0 18px; border: 1px solid var(--border); }
    .transport-tabs button { flex: 1; min-height: 44px; border: 0; border-right: 1px solid var(--border); background: #171a1f; color: var(--muted); cursor: pointer; }
    .transport-tabs button:last-child { border-right: 0; }
    .transport-tabs button.is-active { background: #172630; color: var(--text-strong); box-shadow: inset 0 -2px var(--cyan); }
    .url-preview { margin: 14px 0 0; padding: 10px; border: 1px solid var(--border); background: #12151a; color: #a9c8d5; font: 11px/1.5 ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
    .switch {
      position: relative;
      flex: none;
      width: 44px;
      min-height: 26px;
      border: 1px solid #4b515a;
      border-radius: 20px;
      background: #2a2e34;
      cursor: pointer;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #8d939c;
      transition: transform 160ms ease, background 160ms ease;
    }

    .switch.is-on { border-color: #24718e; background: #164357; }
    .switch.is-on::after { transform: translateX(18px); background: var(--cyan); }

    .callout {
      display: flex;
      gap: 11px;
      margin-top: 20px;
      padding: 13px 14px;
      border-left: 3px solid var(--cyan);
      background: #18252d;
      color: #b8d9e5;
      font-size: 12px;
    }

    .callout.warning { border-color: var(--amber); background: #292317; color: #d9c38c; }
    .callout.success { border-color: var(--green); background: #17251b; color: #a8d8b0; }

    .primary, .secondary, .danger, .ghost {
      min-height: 44px;
      border: 1px solid transparent;
      padding: 0 16px;
      font-weight: 680;
      cursor: pointer;
    }

    .primary { background: #17627e; border-color: #247d9d; color: #effbff; }
    .primary:hover { background: #1d718f; }
    .secondary { background: #292e35; border-color: var(--border-strong); color: var(--text); }
    .secondary:hover { background: #323840; }
    .danger { background: #3a2024; border-color: #6c343d; color: #ffb4bc; }
    .ghost { background: transparent; border-color: transparent; color: var(--muted-2); }
    .button-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }

    .progress-list { margin: 22px 0 0; border-top: 1px solid var(--border); }
    .progress-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      border-bottom: 1px solid var(--border);
    }

    .progress-icon {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border: 1px solid var(--border-strong);
      color: var(--muted);
      font-size: 11px;
    }

    .progress-item.is-done .progress-icon { border-color: #2f6840; color: var(--green); background: #18291e; }
    .progress-item.is-active .progress-icon { border-color: #287392; color: var(--cyan); background: #172a33; }
    .progress-state { color: var(--muted); font-size: 12px; }
    .progress-item.is-active .progress-state { color: var(--cyan); }
    .progress-item.is-done .progress-state { color: var(--green); }

    .pairing-grid { display: grid; grid-template-columns: minmax(180px, 230px) minmax(0, 1fr); gap: 26px; align-items: start; }
    .qr-box { padding: 14px; background: #eef4f5; color: #101418; }
    .qr-grid { display: grid; grid-template-columns: repeat(21, 1fr); aspect-ratio: 1; gap: 1px; }
    .qr-grid span { background: transparent; }
    .qr-grid span.on { background: #101418; }
    .qr-caption { margin: 10px 0 0; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
    .countdown { color: var(--amber); font: 700 18px/1 ui-monospace, Menlo, monospace; }
    .security-list { padding: 0; margin: 16px 0 0; list-style: none; }
    .security-list li { position: relative; padding: 8px 0 8px 20px; border-bottom: 1px solid var(--border); color: var(--muted-2); font-size: 12px; }
    .security-list li::before { content: "✓"; position: absolute; left: 0; color: var(--green); }

    .verify-code { margin: 18px 0; color: var(--text-strong); font: 760 clamp(28px, 5vw, 46px)/1 ui-monospace, Menlo, monospace; letter-spacing: 0.14em; }
    .permission-list { margin-top: 18px; border-top: 1px solid var(--border); }
    .permission-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .permission-row input { width: 18px; height: 18px; accent-color: var(--cyan); }
    .permission-row label { flex: 1; cursor: pointer; }
    .permission-row small { display: block; color: var(--muted); margin-top: 2px; }

    .device-list { margin-top: 20px; border: 1px solid var(--border); }
    .device-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px; }
    .device-row + .device-row { border-top: 1px solid var(--border); }
    .device-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .device-row strong { display: block; color: var(--text-strong); }
    .device-row small { color: var(--muted); }

    .phone-frame {
      position: relative;
      width: min(100%, 390px);
      height: 630px;
      margin: 0 auto;
      padding: 11px;
      border: 1px solid #4a5059;
      border-radius: 36px;
      background: #090b0d;
      box-shadow: var(--shadow);
    }

    .phone-screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border: 1px solid #252a31;
      border-radius: 27px;
      background: var(--bg);
    }

    .phone-statusbar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: var(--muted-2);
      font: 650 10px/1 -apple-system, sans-serif;
    }

    .phone-content { height: calc(100% - 28px); overflow: auto; padding: 15px 16px 22px; }
    .mobile-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .mobile-brand { display: flex; align-items: center; gap: 8px; color: var(--text-strong); font-weight: 740; }
    .mobile-brand .brand-mark { width: 23px; height: 23px; font-size: 12px; }
    .mobile-state { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: 11px; }
    .mobile-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .mobile-state.pending { color: var(--amber); }
    .mobile-state.offline { color: var(--red); }

    .mobile-hero { padding: 24px 0 20px; border-bottom: 1px solid var(--border); }
    .mobile-hero h2 { margin-bottom: 8px; color: var(--text-strong); font-size: 22px; letter-spacing: -0.025em; }
    .mobile-hero p { color: var(--muted-2); }
    .mobile-actions { display: grid; gap: 9px; margin-top: 18px; }
    .mobile-actions button { width: 100%; }

    .phone-qr { width: min(72%, 220px); margin: 20px auto; }
    .phone-code { padding: 20px 0; text-align: center; }
    .phone-code .verify-code { font-size: 30px; }
    .waiting-line { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--amber); font-size: 12px; }
    .waiting-line::before { content: ""; width: 8px; height: 8px; border: 1px solid currentColor; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; transform: scale(0.75); } }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
    .chip { min-height: 24px; display: inline-flex; align-items: center; padding: 0 8px; border: 1px solid var(--border); color: var(--muted-2); background: #1a1e23; font-size: 10px; font-weight: 650; }
    .chip.secure { border-color: #285c3a; color: #9dd6a7; background: #17241b; }
    .chip.permission { border-color: #2b5366; color: #98d1e6; background: #17252c; }

    .tabbar { display: grid; grid-template-columns: 1fr 1fr; margin: 0 -16px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .tabbar.is-single { grid-template-columns: 1fr; }
    .tabbar button { min-height: 44px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
    .tabbar button.is-active { color: var(--text-strong); box-shadow: inset 0 -2px var(--cyan); }
    .approval-count { color: var(--amber); }

    .workspace-group + .workspace-group { margin-top: 18px; }
    .workspace-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .workspace-head strong { color: var(--text-strong); font-size: 12px; }
    .workspace-state { padding: 2px 6px; color: var(--blue); background: #182536; font-size: 9px; font-weight: 700; text-transform: uppercase; }
    .workspace-state.warm { color: #d8bd78; background: #2b2518; }
    .workspace-action { margin-left: auto; min-height: 44px; padding: 0 9px; border: 1px solid #425447; color: #9ed1a7; background: #1a2820; font-size: 10px; cursor: pointer; }

    .session-row {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .session-row:hover { background: #1d2228; }
    .session-row:disabled { cursor: default; opacity: 0.55; }
    .session-title { display: block; color: var(--text-strong); font-weight: 650; }
    .session-agent { display: block; margin-top: 3px; color: var(--muted); font: 11px/1.35 ui-monospace, Menlo, monospace; }
    .session-status { padding: 3px 7px; color: var(--blue); background: #182536; font-size: 9px; font-weight: 700; }
    .session-status.waiting { color: #e3c278; background: #2b2518; }
    .session-status.idle { color: var(--muted-2); background: #262a30; }

    .approval-item { padding: 13px 0; border-bottom: 1px solid var(--border); }
    .approval-item strong { color: var(--text-strong); }
    .approval-item pre { max-height: 100px; overflow: auto; padding: 9px; background: var(--surface-2); color: var(--muted-2); font: 10px/1.45 ui-monospace, monospace; white-space: pre-wrap; }

    .modal-shade { position: absolute; inset: 28px 0 0; display: grid; place-items: end stretch; background: rgba(5, 7, 9, 0.68); z-index: 4; }
    .mobile-sheet { padding: 20px 16px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border-strong); background: #20242a; }
    .mobile-sheet h3 { margin-bottom: 7px; color: var(--text-strong); font-size: 16px; }
    .mobile-sheet p { color: var(--muted-2); font-size: 12px; }

    .recovery-list { margin-top: 18px; }
    .recovery-row { display: grid; grid-template-columns: 9px minmax(0, 1fr); gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .recovery-row::before { content: ""; width: 7px; height: 7px; margin-top: 6px; background: var(--amber); }
    .recovery-row strong { display: block; color: var(--text-strong); font-size: 12px; }
    .recovery-row span { color: var(--muted); font-size: 11px; }

    .stage-controls {
      max-width: 1360px;
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .stage-controls p { margin: 0; color: var(--muted); font-size: 12px; }
    .stage-controls .button-row { margin: 0; }

    .terminal-view {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100%;
      height: 100vh;
      height: var(--vv-height, 100dvh);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      background: var(--surface-2);
    }

    body.terminal-open { overflow: hidden; }
    .terminal-topbar {
      min-height: 58px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: calc(7px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 7px calc(12px + env(safe-area-inset-left));
      border-bottom: 1px solid var(--border);
      background: #171a1f;
    }

    .terminal-back { min-width: 44px; min-height: 44px; padding: 0 11px; border: 1px solid var(--border); background: #20242a; color: var(--text); cursor: pointer; }
    .terminal-heading { min-width: 0; }
    .terminal-heading strong { display: block; overflow: hidden; color: var(--text-strong); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .terminal-heading span { display: block; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .terminal-connection { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: 10px; white-space: nowrap; }
    .terminal-connection::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .terminal-connection.is-offline { color: var(--red); }

    .terminal-stage { position: relative; min-height: 0; overflow: hidden; background: #090b0e; }
    .terminal-screen {
      position: absolute;
      inset: 0;
      overflow: auto;
      padding: clamp(13px, 3vw, 24px);
      color: #d5dae0;
      font: clamp(10px, 2.2vw, 14px)/1.55 D2Coding, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      overscroll-behavior: contain;
    }

    .term-muted { color: #767f89; }
    .term-cyan { color: #52c8ee; }
    .term-green { color: #70d984; }
    .term-amber { color: #e5b75e; }
    .term-cursor { display: inline-block; width: 0.64em; height: 1.1em; margin-left: 2px; vertical-align: -0.18em; background: #d8dde2; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .terminal-bottom { border-top: 1px solid var(--border); background: #171a1f; }
    .terminal-tools { display: flex; gap: 6px; overflow-x: auto; padding: 8px calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left)); scrollbar-width: none; touch-action: pan-x; }
    .terminal-tools::-webkit-scrollbar { display: none; }
    .terminal-tools button { flex: none; min-width: 46px; min-height: 44px; border: 1px solid var(--border); background: #24282e; color: var(--text); cursor: pointer; }
    .terminal-tools button:disabled { opacity: 0.38; cursor: not-allowed; }

    .terminal-composer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: 7px; padding: 8px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
    .terminal-composer textarea { min-height: 44px; max-height: 110px; resize: none; border: 1px solid var(--border-strong); border-radius: 0; padding: 10px 11px; background: #0f1216; color: var(--text); font-size: 16px; }
    .terminal-composer button { min-width: 48px; border: 1px solid var(--border-strong); background: #252a31; color: var(--text); cursor: pointer; }
    .terminal-composer .send { background: #17627e; border-color: #247d9d; color: #fff; }
    .terminal-composer button:disabled, .terminal-composer textarea:disabled { opacity: 0.4; cursor: not-allowed; }

    .permission-request { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px calc(12px + env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }
    .permission-request p { margin: 0; color: var(--muted-2); font-size: 12px; }
    .permission-request button { flex: none; }

    .terminal-debug {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 7px;
      z-index: 2;
    }

    .terminal-debug button { min-height: 44px; padding: 0 9px; border: 1px solid #3a414b; background: rgba(24, 28, 34, 0.92); color: var(--muted-2); font-size: 10px; cursor: pointer; }
    .disconnect-overlay { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 24px; background: rgba(9, 11, 14, 0.78); backdrop-filter: blur(3px); }
    .disconnect-box { width: min(100%, 410px); border: 1px solid #5c3c42; background: #21181b; padding: 22px; box-shadow: var(--shadow); }
    .disconnect-box .offline-icon { width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 16px; border: 1px solid #75444d; color: var(--red); }
    .disconnect-box h2 { margin-bottom: 7px; color: var(--text-strong); font-size: 19px; }
    .disconnect-box p { color: var(--muted-2); }
    .last-seen { color: var(--muted); font: 11px/1.4 ui-monospace, Menlo, monospace; }
    .privacy-curtain { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 24px; background: #0b0d10; color: var(--muted-2); text-align: center; }
    .privacy-curtain strong { display: block; margin-bottom: 7px; color: var(--text-strong); font-size: 17px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      z-index: 140;
      max-width: min(90vw, 440px);
      transform: translateX(-50%);
      border: 1px solid var(--border-strong);
      background: #242a31;
      color: var(--text);
      padding: 10px 13px;
      box-shadow: var(--shadow);
      font-size: 12px;
    }

    @media (max-width: 919px) {
      .prototype-shell { padding-left: 12px; padding-right: 12px; }
      .prototype-header { align-items: stretch; flex-direction: column; }
      .prototype-badge { align-self: flex-start; }
      .flow-rail { grid-template-columns: repeat(7, 132px); }
      .stage-switcher { display: grid; }
      .scenario-stage { display: block; min-height: 0; }
      .desktop-wrap, .phone-wrap { display: none; }
      .desktop-wrap.is-mobile-active, .phone-wrap.is-mobile-active { display: flex; }
      .desktop-frame { min-height: 620px; }
      .phone-frame { height: min(690px, calc(100dvh - 210px)); min-height: 520px; }
      .stage-controls { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 620px) {
      .desktop-body { grid-template-columns: 1fr; }
      .settings-nav { display: none; }
      .settings-content { padding: 24px 18px; }
      .pairing-grid { grid-template-columns: 1fr; }
      .qr-box { width: min(100%, 230px); }
      .desktop-frame { min-height: 600px; }
    }

    @media (max-height: 480px) {
      .terminal-topbar { min-height: 48px; padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: 4px; }
      .terminal-tools { padding-top: 5px; }
      .terminal-composer { padding-top: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <main id="prototype-shell" class="prototype-shell">
    <header class="prototype-header">
      <div>
        <p class="eyebrow">Interactive product scenario</p>
        <h1>기존 Tailscale 유지 + 새로운 모바일 접속</h1>
        <p>Tailscale, Deppy Relay 또는 두 경로를 선택하고 공통 세션 화면과 전체화면 터미널까지 확인합니다.</p>
      </div>
      <span class="prototype-badge">로컬 시뮬레이션 · 실제 연결 없음</span>
    </header>

    <nav id="flow-rail" class="flow-rail" aria-label="연결부터 사용까지"></nav>

    <div class="stage-switcher" aria-label="미리보기 기기 선택">
      <button type="button" class="is-active" data-action="stage" data-stage="desktop">Mac</button>
      <button type="button" data-action="stage" data-stage="phone">모바일</button>
    </div>

    <section class="scenario-stage" aria-label="연결 시나리오 미리보기">
      <div id="desktop-wrap" class="desktop-wrap is-mobile-active">
        <div class="device-caption"><strong>Deppy Sijo · Mac</strong><span class="device-status">이 Mac에서 발신 연결</span></div>
        <section class="desktop-frame" aria-label="Mac 설정 화면">
          <div class="window-chrome" aria-hidden="true">
            <span class="traffic"></span><span class="traffic"></span><span class="traffic"></span>
            <span class="window-title">Deppy Sijo — 설정</span>
          </div>
          <div class="desktop-body">
            <aside class="settings-nav" aria-label="설정 카테고리">
              <div class="nav-brand"><span class="brand-mark">D</span> Deppy Sijo</div>
              <button type="button">일반</button>
              <button type="button">에이전트</button>
              <button type="button" class="is-active">모바일 연결</button>
              <button type="button">보안</button>
              <button type="button">알림</button>
            </aside>
            <div id="desktop-stage" class="settings-content"></div>
          </div>
        </section>
      </div>

      <div id="phone-wrap" class="phone-wrap">
        <div class="device-caption"><strong>모바일 웹 · PWA</strong><span>390 × 844 기준</span></div>
        <section class="phone-frame" aria-label="모바일 화면">
          <div class="phone-screen">
            <div class="phone-statusbar" aria-hidden="true"><span>9:41</span><span>5G&nbsp;&nbsp;●●●&nbsp;&nbsp;92%</span></div>
            <div id="phone-stage" class="phone-content"></div>
            <div id="phone-modal"></div>
          </div>
        </section>
      </div>
    </section>

    <footer class="stage-controls">
      <p id="step-description"></p>
      <div class="button-row">
        <button type="button" class="secondary" data-action="previous-step">이전</button>
        <button type="button" class="primary" data-action="next-step">다음 화면</button>
      </div>
    </footer>
  </main>

  <section id="terminal-view" class="terminal-view" role="dialog" aria-modal="true" aria-labelledby="terminal-title" hidden></section>
  <div id="toast" class="toast" role="status" hidden></div>

  <script>
    (() => {
      'use strict';

      const FLOW = [
        'connection-method',
        'transport-connecting',
        'pairing-qr',
        'pairing-confirm',
        'session-list',
        'terminal',
        'recovery',
      ];

      const FLOW_META = [
        { label: '접속 방식', description: '기존 Tailscale을 유지하고 필요한 경우 Relay를 별도로 켭니다.' },
        { label: '연결 준비', description: '선택한 transport의 상태를 서로 섞지 않고 확인합니다.' },
        { label: 'QR 페어링', description: 'Tailscale 기존 QR 또는 Relay 일회용 QR로 연결합니다.' },
        { label: '기기 확인', description: 'Relay는 상호 확인하고, Tailscale은 기존 인증을 유지합니다.' },
        { label: '세션 선택', description: '워크스페이스와 실행 중인 세션을 고릅니다.' },
        { label: '전체화면', description: '선택 즉시 모바일 viewport 전체를 터미널로 사용합니다.' },
        { label: '중단·복구', description: '연결, 권한, 세션 종료 원인에 맞게 복구합니다.' },
      ];

      const TRANSPORT_OPTIONS = [
        { id: 'tailscale', title: 'Tailscale만', note: '기존 Serve와 ts.net 주소를 그대로 사용' },
        { id: 'relay', title: 'Deppy Relay만', note: 'Tailscale 없이 외부 네트워크에서 접속' },
        { id: 'both', title: '둘 다 사용', note: '두 경로를 명시적으로 동시에 활성화' },
      ];

      const TAILSCALE_PROGRESS = ['Tailscale 상태 확인', 'Serve 상태 확인', 'ts.net HTTPS 준비'];
      const RELAY_PROGRESS = ['인터넷 연결 확인', 'Deppy 보안 릴레이 연결', '종단 간 암호화 채널 준비'];

      const WORKSPACES = [
        {
          name: 'deppy-sijo',
          state: 'active',
          sessions: [
            { id: 'codex-review', title: '코드 리뷰', agent: 'Codex · 작업 중', status: 'running' },
            { id: 'release-build', title: '릴리즈 빌드', agent: 'Shell', status: 'waiting' },
          ],
        },
        {
          name: 'design-system',
          state: 'warm',
          sessions: [
            { id: null, title: '모바일 화면 설계', agent: 'Claude', status: 'idle' },
          ],
        },
      ];

      const state = {
        step: 0,
        stage: 'desktop',
        phoneSurface: 'sessions',
        permissions: { view: true, input: false, approval: false },
        terminalMode: 'connected',
        selectedSession: null,
        warmConfirm: false,
        draft: '현재 변경사항을 요약해줘',
        recoveryReason: 'session-ended',
        privacyCurtain: false,
        warmActivated: false,
        transportMode: 'tailscale',
        pairingTransport: 'tailscale',
        pairedTransports: { tailscale: false, relay: false },
      };

      const shell = document.getElementById('prototype-shell');
      const rail = document.getElementById('flow-rail');
      const desktopStage = document.getElementById('desktop-stage');
      const phoneStage = document.getElementById('phone-stage');
      const phoneModal = document.getElementById('phone-modal');
      const terminalView = document.getElementById('terminal-view');
      const toast = document.getElementById('toast');
      let terminalReturnFocus = null;
      let terminalReturnSession = null;
      let toastTimer = null;

      history.replaceState({ deppyView: 'scenario' }, '');

      function setStep(index) {
        const next = Math.max(0, Math.min(FLOW.length - 1, index));
        if (state.selectedSession && next !== 5) {
          closeTerminal({ fromHistory: false, nextStep: next });
          return;
        }
        state.step = next;
        if (next === 5 && !state.selectedSession) {
          const trigger = document.querySelector('[data-session="codex-review"]');
          openTerminal('codex-review', trigger);
          return;
        }
        render();
      }

      function completePairing(kind) {
        if (kind !== 'tailscale' && kind !== 'relay') return;
        state.pairedTransports[kind] = true;
        state.recoveryReason = 'session-ended';
      }

      function advanceStep() {
        if (state.step === FLOW.length - 1) {
          setStep(0);
          return;
        }
        if (FLOW[state.step] === 'pairing-qr' && state.pairingTransport === 'tailscale') {
          completePairing('tailscale');
          state.stage = 'phone';
          setStep(4);
          return;
        }
        if (FLOW[state.step] === 'pairing-confirm') {
          completePairing(state.pairingTransport);
          state.stage = 'phone';
          setStep(4);
          return;
        }
        setStep(state.step + 1);
      }

      function render() {
        renderRail();
        renderDesktop();
        renderPhone();
        renderStageSelection();
        syncTerminalView();
        document.getElementById('step-description').textContent = FLOW_META[state.step].description;
        const previous = document.querySelector('[data-action="previous-step"]');
        const next = document.querySelector('[data-action="next-step"]');
        previous.disabled = state.step === 0;
        next.textContent = state.step === FLOW.length - 1 ? '처음부터' : state.step === 4 ? '전체화면 보기' : '다음 화면';
      }

      function renderRail() {
        rail.innerHTML = FLOW_META.map((item, index) => `
          <button type="button" class="flow-step" data-action="go-step" data-step="${index}" ${index === state.step ? 'aria-current="step"' : ''}>
            <span class="flow-index">0${index + 1}</span>
            <span class="flow-label">${item.label}</span>
          </button>
        `).join('');
      }

      function desktopHeader(title, lead) {
        return `<p class="settings-kicker">설정 / 모바일 연결</p><h2>${title}</h2><p class="settings-lead">${lead}</p>`;
      }

      function setTransportMode(mode) {
        if (!['tailscale', 'relay', 'both'].includes(mode)) return;
        state.transportMode = mode;
        if (mode !== 'both') state.pairingTransport = mode;
        else if (!['tailscale', 'relay'].includes(state.pairingTransport)) state.pairingTransport = 'tailscale';
        render();
      }

      function enabledTransports() {
        if (state.transportMode === 'both') return ['tailscale', 'relay'];
        return [state.transportMode];
      }

      function availablePairingTransports() {
        if (state.transportMode === 'both') return ['tailscale', 'relay'];
        return [state.transportMode];
      }

      function transportLabel() {
        if (state.transportMode === 'both') return 'Tailscale + Relay';
        return state.transportMode === 'tailscale' ? 'Tailscale' : 'Relay · 종단 간 암호화';
      }

      function isAuthenticationRecovery() {
        const authenticationFailed = state.recoveryReason === 'pairing-denied' || state.recoveryReason === 'device-revoked';
        const alternateAuthenticated = enabledTransports().some((kind) => state.pairedTransports[kind]);
        return authenticationFailed && !alternateAuthenticated;
      }

      function transportOptionsMarkup() {
        return `<div class="transport-options" role="radiogroup" aria-label="모바일 접속 방식">${TRANSPORT_OPTIONS.map((option) => `
          <button type="button" class="transport-option ${state.transportMode === option.id ? 'is-selected' : ''}" data-action="select-transport" data-transport="${option.id}" role="radio" aria-checked="${state.transportMode === option.id}">
            <span class="transport-radio" aria-hidden="true"></span>
            <span><strong>${option.title}</strong><small>${option.note}</small></span>
            <span class="transport-tag ${option.id === 'relay' ? 'new' : ''}">${option.id === 'tailscale' ? '기존' : option.id === 'relay' ? '신규' : '고급'}</span>
          </button>`).join('')}</div>`;
      }

      function transportProgressGroup(kind) {
        const tailscale = kind === 'tailscale';
        const steps = tailscale ? TAILSCALE_PROGRESS : RELAY_PROGRESS;
        return `<section class="transport-group"><div class="transport-group-head"><strong>${tailscale ? 'Tailscale Serve' : 'Deppy Relay'}</strong><span>${tailscale ? '기존 경로' : '신규 경로'}</span></div><div class="progress-list">
          ${progressRow(steps[0], '완료', 'is-done', '✓')}
          ${progressRow(steps[1], '완료', 'is-done', '✓')}
          ${progressRow(steps[2], '확인 중', 'is-active', '··')}
        </div></section>`;
      }

      function pairingTransportTabs() {
        const available = availablePairingTransports();
        if (available.length < 2) return '';
        return `<div class="transport-tabs" aria-label="페어링 경로">${available.map((kind) => `<button type="button" data-action="pairing-transport" data-transport="${kind}" class="${state.pairingTransport === kind ? 'is-active' : ''}">${kind === 'tailscale' ? 'Tailscale QR' : 'Relay QR'}</button>`).join('')}</div>`;
      }

      function connectedTransportRows() {
        return enabledTransports().map((kind) => kind === 'tailscale' ? `
          <div class="settings-row"><div><p class="row-title">Tailscale Serve</p><p class="row-copy">mac.tail.example.ts.net · 기존 설정 유지</p></div><strong style="color:var(--green)">준비됨</strong></div>` : `
          <div class="settings-row"><div><p class="row-title">Deppy Relay</p><p class="row-copy">relay.deppy.app · outbound WSS · E2EE</p></div><strong style="color:var(--green)">서비스 연결됨</strong></div>`).join('');
      }

      function connectedDeviceRows() {
        return enabledTransports().map((kind) => {
          const paired = state.pairedTransports[kind];
          if (kind === 'tailscale') {
            return `<div class="settings-row"><div><p class="row-title">Tailscale 브라우저 인증</p><p class="row-copy">${paired ? '기존 token gate로 접속 중' : 'Serve는 준비됐지만 이 기기는 아직 인증하지 않음'}</p></div><strong>${paired ? '인증됨' : '미인증'}</strong></div>`;
          }
          if (paired) {
            return `<div class="device-list"><div class="device-row"><span class="device-dot"></span><div><strong>기대호의 iPhone</strong><small>Relay로 접속 중 · 기기별 자격증명</small></div><button type="button" class="secondary" data-action="revoke-device">Relay 접근 폐기</button></div></div>`;
          }
          return `<div class="settings-row"><div><p class="row-title">Relay 모바일 기기</p><p class="row-copy">Relay 서비스는 활성 상태지만 이 기기는 아직 페어링하지 않음</p></div><strong>미페어링</strong></div>`;
        }).join('');
      }

      function renderDesktop() {
        switch (FLOW[state.step]) {
          case 'connection-method':
            desktopStage.innerHTML = desktopHeader('모바일 연결 방식', '기존 Tailscale은 그대로 유지됩니다. 필요한 경우 Deppy Relay를 별도로 추가하거나 두 경로를 함께 켤 수 있습니다.') + `
              ${transportOptionsMarkup()}
              <div class="callout"><span>↔</span><span>연결 실패 시 다른 경로로 자동 전환하지 않습니다. 접속 주소, 상태와 인증 정보는 transport별로 독립 관리합니다.</span></div>
              <div class="button-row"><button type="button" class="primary" data-action="transport-start">${transportLabel()}로 계속</button></div>`;
            break;
          case 'transport-connecting':
            desktopStage.innerHTML = desktopHeader(state.transportMode === 'both' ? '두 연결 경로 준비' : `${transportLabel()} 연결 준비`, state.transportMode === 'both' ? 'Tailscale과 Relay 상태를 합치지 않고 각각 확인합니다.' : state.transportMode === 'tailscale' ? '기존 Tailscale Serve와 ts.net HTTPS 상태를 확인합니다.' : 'Mac이 Relay로 outbound WSS를 만들고 기기 간 암호화 채널을 준비합니다.') + `
              <div class="transport-groups">${enabledTransports().map(transportProgressGroup).join('')}</div>
              <div class="callout ${state.transportMode === 'both' ? 'warning' : ''}"><span>${state.transportMode === 'both' ? '!' : '◇'}</span><span>${state.transportMode === 'both' ? '두 경로가 모두 켜져 있어도 장애 시 자동 우회하지 않습니다.' : state.transportMode === 'tailscale' ? '현재 Tailscale 설정과 페어링 토큰 동작은 변경되지 않습니다.' : 'Relay는 터미널 화면과 입력 내용을 읽을 수 없습니다.'}</span></div>

          </header>
          <div class="terminal-stage">
            <div class="terminal-screen" aria-label="시뮬레이션 터미널 출력"><span class="term-muted">Last login: Fri Aug 28 14:02:11 on ttys004</span>
<span class="term-cyan">jr@Mac</span> <span class="term-green">deppy-sijo</span> % codex review

<span class="term-muted">› Reading current changes...</span>
  ✓ mobile relay boundary inspected
  ✓ one-time pairing flow specified
  ✓ full-viewport session layout prepared

<span class="term-amber">Reviewing</span>  docs/mockups/mobile-relay-fullscreen-scenario.html

The selected session now occupies the complete mobile viewport.
Browser Back returns to the session list without leaving the app.

<span class="term-cyan">jr@Mac</span> <span class="term-green">deppy-sijo</span> % <span class="term-cursor"></span></div>
            <div class="terminal-debug">
              <button type="button" data-action="simulate-disconnect">연결 끊김 시뮬레이션</button>
              <button type="button" data-action="simulate-session-end">세션 종료 시뮬레이션</button>
            </div>
            ${disconnected ? disconnectOverlay() : ''}
            ${state.privacyCurtain ? '<div class="privacy-curtain" role="status"><div><strong>터미널 화면을 가렸습니다</strong><span>Deppy Sijo로 돌아오면 같은 세션을 계속 볼 수 있습니다.</span></div></div>' : ''}
          </div>
          <footer class="terminal-bottom">
            <div class="terminal-tools" aria-label="터미널 특수키">
              ${['Esc', 'Tab', '↑', '↓', '←', '→', 'Ctrl-C', 'Enter'].map((key) => `<button type="button" data-action="terminal-key" ${disconnected || !state.permissions.input ? 'disabled' : ''}>${key}</button>`).join('')}
            </div>
            ${state.permissions.input ? `
              <div class="terminal-composer">
                <button type="button" aria-label="파일 첨부" ${disconnected ? 'disabled' : ''}>＋</button>
                <textarea id="terminal-draft" rows="1" placeholder="메시지 입력…" ${disconnected ? 'disabled' : ''}></textarea>
                <button type="button" class="send" data-action="send-draft" ${disconnected ? 'disabled' : ''}>전송</button>
              </div>` : `
              <div class="permission-request"><p>이 기기는 보기 전용입니다. Mac에서 입력 권한을 추가해야 합니다.</p><button type="button" class="secondary" data-action="request-input">입력 권한 요청</button></div>`}
          </footer>`;
        const draft = document.getElementById('terminal-draft');
        if (draft) draft.value = state.draft;
      }

      function terminalContext() {
        if (state.selectedSession === 'release-build') return { workspace: 'deppy-sijo', title: '릴리즈 빌드', agent: 'Shell', cwd: 'target/release' };
        if (state.selectedSession === 'mobile-design') return { workspace: 'design-system', title: '모바일 화면 설계', agent: 'Claude', cwd: 'design/mobile' };
        return { workspace: 'deppy-sijo', title: '코드 리뷰', agent: 'Codex', cwd: 'docs/mockups' };
      }

      function disconnectOverlay() {
        return `<div class="disconnect-overlay"><section class="disconnect-box" role="alertdialog" aria-labelledby="disconnect-title"><div class="offline-icon">!</div><h2 id="disconnect-title">연결을 복구하고 있습니다</h2><p>마지막 화면을 유지했습니다. 연결이 돌아올 때까지 입력과 특수키는 전송되지 않습니다.</p><p class="last-seen">마지막 수신 21:04:18 · draft 자동 전송 안 함</p><div class="button-row"><button type="button" class="primary" data-action="reconnect-terminal">다시 연결</button><button type="button" class="secondary" data-action="close-terminal">세션 목록으로</button></div></section></div>`;
      }

      function endSession() {
        state.selectedSession = null;
        state.terminalMode = 'connected';
        state.privacyCurtain = false;
        state.step = 6;
        state.recoveryReason = 'session-ended';
        document.body.classList.remove('terminal-open');
        if (history.state?.deppyView === 'terminal') history.back();
        render();
        showToast('세션이 종료되었습니다. 입력 초안은 전송되지 않았습니다.');
      }

      function showToast(message) {
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        toastTimer = setTimeout(() => { toast.hidden = true; }, 3600);
      }

      document.addEventListener('input', (event) => {
        if (event.target.id === 'terminal-draft') state.draft = event.target.value;
      });

      document.addEventListener('change', (event) => {
        const input = event.target.closest('[data-action="permission"]');
        if (!input) return;
        state.permissions[input.dataset.permission] = input.checked;
        render();
      });

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        const action = target.dataset.action;

        if (action === 'go-step') setStep(Number(target.dataset.step));
        else if (action === 'previous-step') setStep(state.step - 1);
        else if (action === 'next-step') advanceStep();
        else if (action === 'stage') { state.stage = target.dataset.stage; renderStageSelection(); }
        else if (action === 'select-transport') setTransportMode(target.dataset.transport);
        else if (action === 'transport-start') setStep(1);
        else if (action === 'transport-ready') setStep(2);
        else if (action === 'pairing-transport') { state.pairingTransport = target.dataset.transport; render(); }
        else if (action === 'qr-scanned') {
          if (state.pairingTransport === 'tailscale') { completePairing('tailscale'); state.stage = 'phone'; setStep(4); showToast('기존 Tailscale 경로로 연결했습니다.'); }
          else setStep(3);
        }
        else if (action === 'regenerate-qr') showToast('새 일회용 QR을 발급했습니다. 만료 시간이 5분으로 갱신되었습니다.');
        else if (action === 'copy-tailscale-url') showToast('프로토타입: Tailscale 접속 주소를 표시했습니다. 실제 토큰은 포함하지 않습니다.');
        else if (action === 'continue-tailscale') { completePairing('tailscale'); state.stage = 'phone'; setStep(4); showToast('기존 Tailscale 인증으로 세션 화면을 열었습니다.'); }
        else if (action === 'approve-device') { completePairing('relay'); state.stage = 'phone'; setStep(4); showToast('기대호의 iPhone을 승인했습니다.'); }
        else if (action === 'deny-device') {
          state.pairedTransports.relay = false;
          state.recoveryReason = 'pairing-denied';
          state.stage = 'phone';
          if (state.transportMode === 'both' && state.pairedTransports.tailscale) { state.pairingTransport = 'tailscale'; setStep(4); showToast('Relay 요청을 거부했습니다. 인증된 Tailscale 경로는 계속 사용할 수 있습니다.'); }
          else if (state.transportMode === 'both') { state.pairingTransport = 'tailscale'; setStep(2); showToast('Relay 요청을 거부했습니다. 계속하려면 기존 Tailscale QR로 인증하세요.'); }
          else setStep(6);
        }
        else if (action === 'phone-tab') {
          if (target.dataset.tab === 'approvals' && !state.permissions.approval) return;
          state.phoneSurface = target.dataset.tab;
          renderPhone();
        }
        else if (action === 'open-terminal' && target.dataset.session) openTerminal(target.dataset.session, target);
        else if (action === 'close-terminal') closeTerminal();
        else if (action === 'simulate-disconnect') { state.terminalMode = 'disconnected'; syncTerminalView(); }
        else if (action === 'reconnect-terminal') { state.terminalMode = 'connected'; syncTerminalView(); showToast('암호화 연결이 복구되었습니다. 초안은 자동 전송하지 않았습니다.'); }
        else if (action === 'simulate-session-end') endSession();
        else if (action === 'send-draft') { state.draft = ''; syncTerminalView(); showToast('프로토타입: 실제 전송 없이 입력만 초기화했습니다.'); }
        else if (action === 'terminal-key') showToast(`프로토타입: ${target.textContent} 키는 실제 세션으로 전송되지 않습니다.`);
        else if (action === 'request-input') showToast('Mac으로 입력 권한 요청을 보냈습니다.');
        else if (action === 'warm-confirm-open') { state.warmConfirm = true; renderPhone(); }
        else if (action === 'warm-cancel') { state.warmConfirm = false; renderPhone(); }
        else if (action === 'warm-confirm') { state.warmConfirm = false; state.warmActivated = true; showToast('Mac의 활성 워크스페이스를 design-system으로 전환했습니다.'); renderPhone(); }
        else if (action === 'approval-demo' && state.permissions.approval) showToast('프로토타입: 승인 결과는 실제 도구 실행에 전달되지 않습니다.');
        else if (action === 'revoke-device') {
          state.pairedTransports.relay = false;
          state.recoveryReason = 'device-revoked';
          if (state.transportMode === 'both' && state.pairedTransports.tailscale) { render(); showToast('Relay 기기 접근만 폐기했습니다. 인증된 Tailscale 경로는 유지됩니다.'); }
          else { state.pairingTransport = state.transportMode === 'tailscale' ? 'tailscale' : 'relay'; state.stage = 'phone'; setStep(6); }
        }
        else if (action === 'recover-to-sessions' && !isAuthenticationRecovery()) { state.stage = 'phone'; setStep(4); }
      });

      window.addEventListener('popstate', () => {
        if (state.selectedSession) closeTerminal({ fromHistory: true, nextStep: 4 });
      });

      function syncVisualViewport() {
        const height = window.visualViewport?.height || window.innerHeight;
        document.documentElement.style.setProperty('--vv-height', `${Math.round(height)}px`);
      }

      syncVisualViewport();
      window.addEventListener('resize', syncVisualViewport, { passive: true });
      window.visualViewport?.addEventListener('resize', syncVisualViewport, { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (!state.selectedSession) return;
        state.privacyCurtain = document.hidden;
        syncTerminalView();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && state.selectedSession) closeTerminal();
      });

      render();
    })();
  </script>
</body>
</html>
