function renderWork(){

><td>목표/시도/검증/산출물 → 원문·Git·세션</td></tr></tbody></table></div><h2>헷갈리지 않는 세 가지 역할</h2><p style="font-size:13px;color:var(--muted)"><strong style="color:var(--text)">장비</strong>는 실행 위치, <strong style="color:var(--text)">에이전트 프로필</strong>은 실행 주체와 모델, <strong style="color:var(--text)">클라우드 연결</strong>은 관찰·입력하는 외부 주체입니다. 연결 토큰을 발급했다고 원격 장비가 등록되거나 작업이 자동 배정되는 구조로 만들지 않습니다.</p><h2>작업과 상태의 계약</h2><div class="architecture mono">Workspace → Task(목표) → Attempt(실행 시도) → Session / Thread\n                       ├ AgentProfile + Device + Worktree\n                       ├ 하위 에이전트 · 수정 범위 · 의존 관계\n                       └ 검증 근거 · 산출물 · 승인 기록\n\n계획 → 배정 대기 → 실행 → 검토 대기 → 검증 완료\n                    └ 승인 대기 / 연결 확인 / 차단</div><p style="font-size:12px;color:var(--muted);margin-top:10px">작업 상태와 CLI 상태를 구분합니다. 기존 authoritative 이벤트와 generation을 재사용하고, 대화 문구·CLI 종료만으로 완료를 추측하지 않습니다. 같은 문장을 새로 제출하면 새 입력이며, 재연결 retry만 같은 전송 ID로 처리합니다.</p><h2>PR별 개발 순서</h2>${[
 ['01','프로젝트·메인·작업/실행 계약','프로젝트 설정과 프로젝트별 메인 세션을 소유하고, Task·Attempt·worker를 연결. 실제 저장소 스키마 조사 후 persistence 결정.','검증: 독립 세션 · 역순/중복 이벤트 · 실행 세대 · 복구'],
 ['02','메인 지휘 화면·프로젝트 설정·터미널 연결','메인 기본 화면, 프로젝트 폴더/메인 모델/로컬 작업자/한도 설정, 배정안, 개별 터미널과 compact 작업 목록.','검증: native 화면 대조 · 키보드/접근성 · light/dark · 좁은 창'],
 ['03','로컬 배정·대기열·작업 격리','한 메인에서 여러 로컬 작업자에 배정. 독립 세션/worktree, 실행 한도, 의존 작업과 파일 충돌 확인.','검증: bootstrap · draining · 긴 한글 입력 · retry · 절전 복구'],
 ['04','메인의 로컬 작업자 오케스트레이션·검증','목표 → 배정안 → 확인 → 실행 → 검토. 하위 에이전트와 완료 조건 evidence 연결.','검증: 부모/자식 종료 순서 · 승인 · 미실행/실패/통과 구분'],

 ].map(([n,title,p,g])=>`<section class="prrow"><span class="prno">PR ${n}</span><div><h3>${title}</h3><p>${p}</p><small>${g}</small></div></section>`).join('')}<div class="note" style="margin-top:18px"><strong>첫 제품 범위: PR1~4, 로컬 우선 MVP</strong>여러 장비 스케줄링은 실행 소유권과 복구가 검증된 다음 확장합니다. 제품 구현 시 각각 상태 harness·회귀·화면 대조를 통과시키고 변경 단위로 리뷰합니다.</div><h2>참고와 판단</h2><p style="font-size:13px;color:var(--muted)">xAegis 실행 소스 a1dd53c의 허브·메인 에이전트·장비 worker를 검토했습니다. 제품 흐름을 참고하며 코드는 복사하지 않습니다. Deppy의 네이티브 터미널·기존 상태 owner·TLS runtime·권한 lease를 유지합니다. 전체 대화 반복 polling 대신 목록/상세와 변경분을 분리합니다.</p><div class="divider"></div><p style="font-size:12px;color:var(--muted)">이 HTML의 실행 상태, 테스트 결과, 장비, 승인은 모두 예시입니다. 실제 CLI·장비·비밀값·네트워크 요청에 연결되지 않습니다. 세부 근거와 구현 경계는 동일 날짜 설계/PR 계획 문서에 기록했습니다.</p></article>`}

 const name=$('#projectName').value.trim(),path=$('#projectPath').value.trim(),model=$('#projectModel').value.trim(),limit=Number($('#projectLimit').value),workers=[];if($('#workerCodex').checked)workers.push('Codex');if($('#workerClaude').checked)workers.push('Claude');
 if(!name||!path||!model||!workers.length||!Number.isInteger(limit)||limit<1||limit>8){$('#drawerError').textContent='이름·폴더·모델을 입력하고 작업자와 실행 한도(1~8)를 확인해 주세요.';return}
 if(projects.some(p=>p.name===name&&(state.editingNew||p.id!==state.projectId))){$('#drawerError').textContent='다른 프로젝트와 이름이 겹칩니다.';return}
 const p=state.editingNew?{id:'project-'+(projects.length+1)}:currentProject();const oldName=p.name;
 Object.assign(p,{name,path,model,main:$('#projectMain').value,effort:$('#projectEffort').value,workers,limit,mode:$('#projectMode').value,worktree:$('#projectWorktree').checked});
 if(state.editingNew)projects.push(p);else if(oldName!==name)tasks.filter(t=>t.project===oldName).forEach(t=>t.project=name);
 state.projectId=p.id;state.view='command';state.report=false;state.closed=true;$('#overlay').innerHTML='';render();toast('프로젝트 설정을 시안에 저장했습니다. 다음 배정부터 적용 · 실제 파일 변경 없음.');
}
function submitMainGoal(){const el=$('#mainGoal');if(!el?.value.trim())return;const p=currentProject();state.mainGoals[p.id]=el.value.trim();state.mainDrafts[p.id]='';state.mainPlans[p.id]={applied:false};render();toast('메인 에이전트 목표 수용 · 예시 배정안을 확인해 주세요. 실제 AI 호출 없음.');$('#mainGoal').focus()}
function applyMainPlan(){
 const p=currentProject();if(state.mainPlans[p.id]?.applied)return;const first=107+tasks.filter(t=>Number(t.id.slice(2))>=107).length;
 const goal=state.mainGoals[p.id];const names=goal?['구현·수정','독립 코드 리뷰','통합 검증']:['입력·viewport 후속 개선','세션 상태 독립 리뷰','통합 회귀와 결과 검토'];
 names.forEach((title,i)=>tasks.push({id:'T-'+(first+i),title:goal?`${goal.slice(0,18)} · ${title}`:title,project:p.name,provider:i===0?p.workers[0]:i===1?(p.workers[1]||p.workers[0]):p.main,model:'프로젝트 프로필에서 확인',device:'이 Mac',status:'queued',step:i===2?`T-${first} · T-${first+1} 결과 대기`:'배정 수용 · 실행 환경 확인 대기',session:'신규',branch:p.worktree?`task/local-${first+i}`:'프로젝트 경로 · 수정 범위 확인',scope:i===0?'구현 파일 범위 · 시작 전 확인':i===1?'독립 리뷰 · 구현 범위 수정 안 함':'통합 검증 worktree',checks:['배정 범위 확인','실행 결과 검증','메인 에이전트 취합'],done:0}));
 state.mainPlans[p.id]={applied:true};render();toast('세 로컬 작업을 예시 대기열에 추가했습니다. 통합 검증은 선행 결과를 기다립니다. 실제 실행 없음.');
}
// 프로젝트 선택은 해당 프로젝트의 메인 초안·작업자·설정을 복원한다.
document.addEventListener('change',e=>{if(e.target.id==='mainProject'){state.projectId=e.target.value;state.closed=true;render()}});

render();
</script>
</body>
</html>
