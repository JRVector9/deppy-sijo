function homeScreen(){
 const p=project(),running=p.tasks.filter(t=>t.state==='running').length,attention=p.tasks.filter(t=>['ready','approval','offline','blocked'].includes(t.state));
 return `<div class="reading"><section class="goal"><div class="byline">프로젝트 목표 · ${esc(p.name)}</div><p class="instruction">${esc(p.goal||'이 프로젝트에서 어떤 작업을 진행할까요?')}</p><div class="main-flow"><span>목표</span><i></i><span>계획·배정</span><i></i><span class="current">독립 실행 ${running}</span><i></i><span>결과 취합</span><i></i><span>검증</span></div></section>${p.tasks.length?`<section class="thread-entry"><time>MAIN</time><div><h2>구현과 독립 리뷰를 나누고, 결과를 모아 검증합니다.</h2><p>메인은 범위와 완료 조건을 정합니다. 각 작업자는 독립 세션에서 실행하고, 현재 진행은 오른쪽에서 계속 확인할 수 있습니다.</p><div class="assignment-outline">${p.tasks.slice(0,3).map((t,i)=>`<div class="outline-row"><span class="number">${String(i+1).padStart(2,'0')}</span><div><strong>${esc(t.role)} · ${esc(t.title)}</strong><small>${esc(t.scope)}</small></div><div class="owner">${esc(t.agent)}<small>${esc(t.device)}</small></div></div>`).join('')}</div><div class="main-summary-foot"><span>${p.worktree?'작업별 독립 worktree':'공유 경로 · 수정 범위 확인'}</span><span>동시 실행 최대 ${p.limit} · ${esc(p.mode)}</span></div></div></section>`:'<section class="thread-entry"><time>MAIN</time><div><h2>첫 목표를 메인 에이전트에게 맡겨 주세요.</h2><p>아래 입력창에 목표를 쓰면 구현·리뷰·검증으로 나눈 배정안을 확인합니다. 다른 컴퓨터는 기기 화면에서 연결할 수 있습니다.</p></div></section>'}${p.plans.map(plan=>planScreen(plan)).join('')}${attention.length?`<section class="thread-entry"><time>CHECK</time><div><h2>지금 확인할 작업 ${attention.length}건</h2><p>명령 승인은 실행 전에, 결과 확인은 제출된 근거를 본 뒤 진행합니다.</p><div class="actions">${attention.map(t=>`<button class="small" data-action="task" data-id="${esc(t.id)}">${t.state==='approval'?'승인 확인':t.state==='ready'?'결과 확인':'상태 확인'} · ${esc(t.agent)} / ${esc(t.role)}</button>`).join('')}</div></div></section>`:''}${p.events.length?`<section class="thread-entry"><time>LIVE</time><div><h2>메인이 작업자 진행과 결과를 모읍니다.</h2>${p.events.slice(-3).map(event=>`<p>${esc(event)}</p>`).join('')}<button class="ghost small" style="padding-left:0;margin-top:10px" data-action="history">프로젝트 전체 기록 ↗</button></div></section>`:''}</div>`;
}
function taskScreen(){
 const t=task();if(!t)return '<div class="empty">선택한 작업을 찾을 수 없습니다.</div>';
 const result=t.state==='ready'||t.state==='done',folder=t.folder||(t.worktree===false?project().path:'.worktrees/'+t.id);
 const tabs=[['work','작업과 결과'],['terminal','원문 터미널'],['git','Git 변경'],['history','기록']].map(([id,label])=>`<button aria-pressed="${detailTab===id}" class="${detailTab===id?'active':''}" data-action="detail-${id}">${label}</button>`).join('');
 let body='';
 if(detailTab==='terminal')body=`<p class="muted" style="font-size:12px;margin-bottom:12px">${esc(t.agent)} 전용 세션 · ${esc(t.device)} · 예시 출력</p><pre class="log">${esc(`${t.provider}\nproject: ${project().name}\nfolder: ${folder}\n\n❯ ${t.title}\n\n${t.activity}\n\n${result?'결과를 제출했습니다. 사용자 확인과 통합 검증은 별도입니다.':t.state==='approval'?'명령 실행은 승인과 선행 작업 확인 이후에 진행합니다.':t.state==='offline'?'마지막 수신 이후 실행 상태를 확인할 수 없습니다.':t.state==='waiting'?'선행 작업의 결과를 기다립니다.':t.state==='queued'?'배정을 접수했습니다. 실행 시작은 미확인입니다.':'현재 작업 범위에서 진행 중입니다.'}`)}</pre>`;
 else if(detailTab==='git')body=gitScreen(t);
 else if(detailTab==='history')body=historyRows(project().history.filter(r=>r.taskId===t.id));
 else body=`<h2>진행 내용</h2><p style="margin-top:10px">${esc(t.activity)}</p><dl class="facts"><dt>배정 범위</dt><dd>${esc(t.scope)}</dd><dt>작업 폴더</dt><dd><code>${esc(folder)}</code></dd><dt>선행 작업</dt><dd>${t.dependencies?.length?t.dependencies.map(id=>esc(project().tasks.find(v=>v.id===id)?.title||id)).join(' · '):'없음'}</dd><dt>완료 조건</dt><dd>${esc(t.criteria||'변경 내용·검증 결과·미해결 항목을 메인에게 전달')}</dd></dl>${t.state==='approval'?approvalScreen(t):''}${t.state==='blocked'?'<div class="notice amber">이 명령은 허용하지 않았습니다. 아래 입력창에서 범위를 바꾸어 요청할 수 있습니다.</div>':''}${t.state==='offline'?'<div class="notice red">마지막 수신 이후 실행 상태를 확인할 수 없습니다. 재연결 전에 같은 작업을 중복 실행하지 않습니다.</div>':''}${result?`<section class="pair"><div class="between"><h2>제출된 결과</h2><span class="badge">예시 결과</span></div><p>${t.role==='리뷰'?'중복 제출 방지와 실패 응답 표시를 검토했습니다. 권고 2건을 메인에게 전달했습니다.':'변경 내용과 확인 기록을 제출했습니다. 미실행 검증은 별도로 표시합니다.'}</p>${t.files.map(f=>`<div class="file-row"><code>${esc(f[0])}</code><span class="green">${esc(f[1])}</span></div>`).join('')}<dl class="facts"><dt>검증 근거</dt><dd>${t.role==='리뷰'?'코드 검토 의견 · 런타임 테스트 미실행':'모바일 동작 확인 기록 · 예시'}</dd><dt>메인 검토</dt><dd>결과 수신 · 통합 확인 대기</dd><dt>사용자 확인</dt><dd>${t.state==='done'?'<span class="green">확인 완료</span>':'미확인'}</dd></dl>${t.role==='리뷰'?'<details><summary>검토 의견 2건 보기</summary><p>결제 요청 중 중복 제출 방지와 실패 응답 시 입력 보존을 권고했습니다.</p></details>':''}<div class="actions">${t.state==='ready'?'<button class="primary" data-action="accept">확인 완료</button><button data-action="rework">보완 요청</button>':''}<button data-action="detail-git">Git 변경 보기</button><button data-action="detail-history">이 작업 기록</button></div></section>`:t.state==='approval'?'':'<div class="notice">실행 종료와 사용자 확인을 구분합니다. 결과가 오면 변경 내용·검증 범위가 여기에 모입니다.</div>'}`;
 return `<div class="reading"><div class="intro"><div class="between"><h1>${esc(t.title)}</h1><span class="state">${stateTag(t.state)}</span></div><div class="detail-meta"><span>${esc(t.agent)} · ${esc(t.role)}</span><span>${esc(t.device)}</span>${t.device==='gpu3090'&&devices.find(d=>d.id==='gpu').state!=='연결됨'?'<span class="red">기기 연결 끊김</span>':''}<span>${esc(t.provider)}</span></div></div><div class="tabs" aria-label="작업 상세">${tabs}</div>${body}</div>`;
}
function deviceScreen(){return `<div class="reading"><div class="intro"><h1>연결된 기기</h1><p>에이전트는 컴퓨터에서 실행하고, 휴대폰으로도 진행과 결과를 확인하세요.</p></div>${devices.map(d=>`<div class="device-row"><span class="device-icon">${icon(d.type)}</span><div><h3>${esc(d.name)}</h3><small>${esc(d.sub)}</small></div><div class="capability">${esc(d.cap)}<small>${d.type==='phone'?'열람·메인에게 입력':d.id==='gpu'?'프로젝트 폴더 연결됨':'이 Mac의 프로젝트 사용'}</small></div><span class="state ${d.state==='연결됨'?'green':'red'}"><i class="dot"></i>${esc(d.state)}</span></div>`).join('')}<section class="pair"><h2>새 기기 연결</h2><p>새 기기의 Deppy에서 연결 코드를 입력한 뒤, 이 화면에서 확인하면 됩니다.</p><div class="pair-options"><button data-action="pair-computer" aria-pressed="${pairKind==='computer'}">${icon('monitor')} 작업용 컴퓨터</button><button data-action="pair-phone" aria-pressed="${pairKind==='phone'}">${icon('phone')} 휴대폰</button></div>${pairStage===0?`<p>${pairKind==='computer'?'설치된 에이전트와 프로젝트 폴더를 확인한 뒤 작업을 배정합니다.':'연결 후 메인에게 지시하고 결과를 확인할 수 있습니다.'}</p><div class="pair-actions"><button class="primary" data-action="pair-code">연결 코드 만들기</button></div>`:pairStage===1?`<p>새 기기에 입력할 코드 <span class="badge">연결 예시 · 5분 유효</span></p><output class="pair-code mono">482 173</output><div class="pair-actions flex"><button data-action="pair-request">상대 기기 요청 보기 <span class="muted">· 시안</span></button><button class="ghost" data-action="pair-cancel">취소</button></div>`:`<div class="pair-request"><div class="between"><h3>${pairKind==='computer'?'MacBook Pro':'새 iPhone'}에서 연결을 요청했습니다.</h3><span class="amber">확인 대기</span></div><dl class="facts"><dt>사용할 프로젝트</dt><dd>${esc(project().name)}</dd><dt>기능</dt><dd>${pairKind==='computer'?'Codex 실행 · 작업과 결과 공유':'작업 열람 · 메인에게 입력'}</dd><dt>프로젝트 폴더</dt><dd>${pairKind==='computer'?'~/projects/'+esc(project().name):'컴퓨터의 프로젝트를 열람'}</dd></dl><div class="actions"><button class="primary" data-action="pair-accept">확인하고 연결</button><button class="ghost" data-action="pair-cancel">거절</button></div></div>`}</section><div class="notice">연결과 작업 배정은 별개입니다. 기기가 연결되어도 실행 중인 작업의 담당은 바뀌지 않습니다.</div></div>`;}
function settingsScreen(){
 const p=newProject?{name:'',path:'',main:'Codex',model:'GPT-6.1-Sol',effort:'xhigh',workers:['Codex','Claude'],limit:3,mode:'배정 전 확인',worktree:true}:project();
 return `<div class="reading form"><div class="intro"><div class="between"><h1>${newProject?'프로젝트 추가':'프로젝트 설정'}</h1>${newProject?'':'<button class="small" data-action="new-project">프로젝트 추가</button>'}</div><p>메인과 작업 폴더를 정하고, 필요할 때 실행 규칙을 조정하세요.</p></div><div class="field"><label for="project-name">프로젝트 이름</label><input id="project-name" value="${esc(p.name)}" maxlength="60" placeholder="프로젝트 이름"></div><div class="field"><label for="project-path">이 Mac의 프로젝트 폴더</label><input id="project-path" value="${esc(p.path)}" placeholder="~/projects/my-project"><small>다른 컴퓨터의 폴더는 기기 연결 시 확인합니다.</small></div><div class="inline-fields"><div class="field"><label for="main-provider">메인 에이전트</label><select id="main-provider"><option ${p.main==='Codex'?'selected':''}>Codex</option><option ${p.main==='Claude'?'selected':''}>Claude</option></select></div><div class="field"><label for="main-model">모델</label><input id="main-model" value="${esc(p.model)}"></div></div><details class="rules"><summary>실행 규칙 <span class="muted" style="font-size:12px;font-weight:400">· 작업자·병렬 실행·자동화</span></summary><p class="rule-note">이 프로젝트의 다음 배정부터 적용합니다.</p><div class="inline-fields"><div class="field"><label for="main-effort">추론 강도</label><select id="main-effort"><option ${p.effort==='xhigh'?'selected':''}>xhigh</option><option ${p.effort==='설정 유지'?'selected':''}>설정 유지</option></select></div><div class="field"><label for="parallel-limit">동시 실행 한도</label><input id="parallel-limit" type="number" min="1" max="8" value="${p.limit}"></div></div><div class="field"><label>사용할 작업 에이전트</label><div class="rule-options"><label><input type="checkbox" id="allow-codex" ${p.workers.includes('Codex')?'checked':''}>Codex</label><label><input type="checkbox" id="allow-claude" ${p.workers.includes('Claude')?'checked':''}>Claude</label></div><small>설치·로그인·프로젝트 폴더가 확인된 기기만 배정 대상에 표시합니다.</small></div><div class="field"><label for="automation-mode">자동화 범위</label><select id="automation-mode"><option ${p.mode==='배정 전 확인'?'selected':''}>배정 전 확인</option><option ${p.mode==='허용 범위 자동 진행'?'selected':''}>허용 범위 자동 진행</option></select><small>명령의 추가 권한이나 배포는 해당 작업에서 따로 확인합니다.</small></div><div class="rule-options"><label><input type="checkbox" id="use-worktree" ${p.worktree?'checked':''}>작업별 독립 worktree 사용</label></div></details><div class="notice">변경한 설정은 진행 중인 작업의 담당·모델·폴더를 바꾸지 않습니다.</div><p id="form-error" class="form-error" role="alert"></p><div class="actions"><button class="primary" data-action="save-settings">${newProject?'프로젝트 추가':'저장'}</button><button class="ghost" data-action="home">취소</button></div><p class="compact-note">시안 설정은 메모리에만 반영됩니다. 새로고침하면 초기화됩니다.</p></div>`;
}
function reportScreen(){return `<div class="reading report"><h1>1안 발전형 · 메인과 작업자를 동시에 봅니다.</h1><p>사용자가 선택한 1안의 세 영역을 유지했습니다. 왼쪽은 프로젝트·세션 탐색, 중앙은 메인의 목표·배정·결과 취합, 오른쪽은 현재 프로젝트 작업자 모니터입니다.</p><h2>오른쪽 패널의 역할</h2><p>작업자별 담당 역할, 상태, 작업 범위, 실행 기기, 최근 진행 내용을 표시합니다. 승인·결과 확인과 원문 터미널로 바로 이동하며 중앙 화면을 바꾸어도 같은 프로젝트의 작업자를 계속 볼 수 있습니다. 전체·확인 필요·실행 중으로 좁혀 볼 수 있습니다.</p><h2>추천안에서 가져온 기능</h2><p>목표별 구현·리뷰·검증 배정, 기기 선택, 선행 작업 연결, 프로젝트 실행 규칙, 정확한 작업의 명령 승인과 결과 확인, Git 변경과 작업별 기록을 유지했습니다. 동일한 문장도 새로 전송하면 별도의 목표로 받습니다.</p><h2>화면을 줄여도 같은 작업</h2><p>넓은 화면에는 세 영역이 함께 나옵니다. 좁은 화면에서는 작업자 버튼으로 오른쪽 패널을 열고, 휴대폰에서는 프로젝트와 작업자를 각각 펼칩니다. 중앙 입력창의 대상은 메인 또는 선택한 작업자로 명확하게 표시됩니다.</p><div class="notice">모든 작업·기기·상태·연결 코드·명령·결과·시각은 시안용 메모리 데이터입니다. 실제 AI·PTY·SSH·인증·파일·테스트에 연결되지 않으며 새로고침하면 초기화됩니다.</div><div class="actions"><button class="primary" data-action="home">메인으로 돌아가기</button><a href="multi-agent-command-center-2026-10-20.html" target="_blank" rel="noopener">기존 1안 보기 ↗</a></div></div>`;}
function tasksScreen(){const p=project();return `<div class="reading"><div class="intro"><h1>프로젝트 작업</h1><p>${esc(p.name)} · ${p.tasks.length}개 독립 작업</p></div>${p.tasks.length?taskRows(p.tasks):'<div class="empty">메인에게 목표를 보내 작업을 배정하세요.</div>'}</div>`;}
let monitorFilter='all';
function renderMonitor(){
 const p=project(),running=p.tasks.filter(t=>t.state==='running').length,rows=p.tasks.filter(t=>monitorFilter==='all'||monitorFilter==='running'&&t.state==='running'||monitorFilter==='attention'&&['approval','ready','offline','blocked'].includes(t.state));
 $('worker-monitor').innerHTML=`<header class="monitor-head"><h2>작업자</h2><small>실행 ${running} / 최대 ${p.limit}</small><button class="icon ghost small" data-action="close-workers" aria-label="작업자 패널 닫기">×</button></header><div class="monitor-scroll"><div class="monitor-filter" aria-label="작업자 필터">${[['all','전체'],['attention','확인 필요'],['running','실행 중']].map(([id,label])=>`<button data-action="monitor-filter" data-id="${id}" aria-pressed="${id===monitorFilter}">${label}</button>`).join('')}</div>${rows.map((t,i)=>`<article class="worker-item ${view==='task'&&taskId===t.id?'selected':''}"><div class="between"><span class="role">${esc(t.agent)} · ${esc(t.role)}</span><span class="state">${stateTag(t.state)}</span></div><h3>${esc(t.title)}</h3><span class="worker-scope">${esc(t.scope)}</span><p class="activity-snippet">${esc(t.activity)}</p><div class="worker-meta"><span class="${taskDeviceOnline(t)?'':'red'}">${esc(t.device)}${taskDeviceOnline(t)?'':' · 연결 끊김'}</span><span>${esc(p.history.find(r=>r.taskId===t.id)?.time||'배정 접수')} · 예시</span></div><div class="worker-actions"><button data-action="task" data-id="${esc(t.id)}">${t.state==='approval'?'승인 확인':t.state==='ready'?'결과 확인':'작업 상세'}</button><button data-action="worker-terminal" data-id="${esc(t.id)}">터미널 ↗</button></div></article>`).join('')||'<div class="empty">해당 상태의 작업자가 없습니다.</div>'}<section class="worker-rules"><h3>이 프로젝트의 실행 규칙</h3><p>메인 ${esc(p.main)} → ${p.workers.map(esc).join(' · ')}<br>${p.worktree?'작업별 독립 worktree':'공유 경로 · 수정 범위 확인'}<br>${esc(p.mode)} · 최대 ${p.limit}개 병렬</p><button class="ghost small" data-action="settings">실행 규칙 설정 ↗</button></section></div><footer class="monitor-foot"><span>기기 ${devices.filter(d=>d.state==='연결됨').length}대 연결 · 예시</span><button class="ghost" data-action="devices">기기 관리 ↗</button></footer>`;
 $('mobile-workers').textContent=`작업자 ${p.tasks.length}`;
}
function switchProject(id,targetTask){if(!projects[id])return;rememberDraft();projectId=id;view=targetTask?'task':'home';if(targetTask)taskId=targetTask;detailTab='work';selectedFile=0;historyFilter='all';monitorFilter='all';newProject=false;pairStage=0;$('app').classList.remove('show-agents','show-workers');render();$('content').scrollTop=0;}

 const p=project();renderAgents();renderMonitor();$('primary-nav').innerHTML=[['home','메인 에이전트'],['tasks','작업 '+p.tasks.length],['terminal','터미널'],['devices','에이전트·기기'],['history','이력']].map(([id,label])=>`<button data-action="nav-${id}" class="${(id==='terminal'?view==='task'&&detailTab==='terminal':id==='tasks'?view==='tasks'||view==='task'&&detailTab!=='terminal':view===id)?'active':''}" ${((id==='terminal'&&view==='task'&&detailTab==='terminal')||(id==='tasks'&&(view==='tasks'||view==='task'&&detailTab!=='terminal'))||view===id)?'aria-current="page"':''}>${esc(label)}</button>`).join('');$('project-heading').innerHTML=`<h1>${esc(p.name)}</h1><span class="scope"><span class="accent">●</span> <code>${esc(p.path)}</code> · 프로젝트 범위</span>`;const option=$('project').querySelector(`[value="${projectId}"]`);if(option)option.textContent=p.name;$('project').value=projectId;$('device-count').textContent=devices.filter(d=>d.state==='연결됨').length;$('home-button').hidden=view==='home';$('history-button').hidden=view==='history';
 $('context').innerHTML=view==='task'&&task()?`<h2>${esc(task().agent)} <span class="muted">· ${esc(task().role)}</span></h2>`:view==='home'?`<h2>메인 에이전트 <small>${esc(p.main)} · ${esc(p.model)} ${esc(p.effort)}</small></h2>`:`<h2>${({devices:'기기',settings:newProject?'프로젝트 추가':'프로젝트 설정',history:'프로젝트 기록',report:'1안 발전형',tasks:'프로젝트 작업'})[view]||'메인'}</h2>`;
 $('content').innerHTML=view==='home'?homeScreen():view==='task'?taskScreen():view==='devices'?deviceScreen():view==='settings'?settingsScreen():view==='history'?historyScreen():view==='tasks'?tasksScreen():reportScreen();
 $('composer-form').hidden=!(view==='home'||view==='task');const t=view==='task'?task():null;const target=t?`${t.agent} · ${t.role} · ${t.device}`:`${p.name} / 메인 ${p.main}`;$('target').textContent=target;$('prompt').setAttribute('aria-label',`${target}에게 보낼 내용`);$('send').setAttribute('aria-label',`${target}에게 전송`);$('prompt').placeholder=t?'이 에이전트에게 추가 내용을 알려 주세요':'메인에게 목표를 알려 주세요 · 구현·리뷰·검증으로 나눕니다';$('prompt').value=p.drafts[t?t.id:'main']||'';$('prompt').disabled=!!t&&(t.state==='offline'||!taskDeviceOnline(t));$('send').disabled=!$('prompt').value.trim()||$('prompt').disabled;
}
function sendPrompt(){
 const text=$('prompt').value.normalize('NFC').trim();if(!text||$('send').disabled)return;const p=project();
 if(view==='task'){const t=task();t.activity=`추가 요청: ${text}`;t.state='queued';logEvent(p,`${t.agent} · ${t.role}에 추가 요청을 접수했습니다. 실행 시작은 미확인입니다.`,t.id);showToast('추가 요청을 접수했습니다 · 시안');}
 else {const options=executionOptions(p);const prefer=(agent,device)=>options.find(v=>v.agent===agent&&(!device||v.deviceId===device))?.value||options[0]?.value||'';p.plans.push({id:`plan-${++sequence}`,goal:text,assignments:[prefer('Claude','mac'),prefer('Codex','gpu'),prefer('Codex','gpu')]});showToast('세 역할의 배정안을 만들었습니다 · 시안');}
 p.drafts[view==='task'?taskId:'main']='';$('prompt').value='';render();$('content').scrollTop=$('content').scrollHeight;
}

function logEvent(p,text,taskId=null,kind='work'){p.events.push(text);p.history.unshift({id:`event-${++sequence}`,taskId,text,kind,time:'방금'});}
function executionOptions(p){return devices.filter(d=>d.type!=='phone'&&d.state==='연결됨'&&(d.id==='mac'||d.projectIds?.includes(projectId))).flatMap(d=>p.workers.filter(agent=>d.cap.split(' · ').includes(agent)).map(agent=>({value:d.id+'|'+agent,deviceId:d.id,device:d.name,agent,label:agent+' · '+d.name})));}
const roles=[{role:'구현',scope:'구현 대상 파일 · 시작 전 범위 확정',criteria:'변경 파일과 구현 결과를 제출'},{role:'리뷰',scope:'독립 코드 리뷰 · 구현 파일 수정 안 함',criteria:'결함·위험·검토 근거를 제출'},{role:'검증',scope:'통합 테스트 · 구현·리뷰 결과 이후',criteria:'테스트 결과·미실행 범위·잔여 문제를 제출'}];
function planScreen(plan){const p=project(),options=executionOptions(p),invalid=plan.assignments.some(value=>!options.some(o=>o.value===value));return `<section class="batch-plan"><div class="between"><h2>목표에서 나눈 작업</h2><span class="badge">예시 배정안 · 배정 전</span></div><p>${esc(plan.goal)}</p><div class="plan-labels"><span>역할 · 수정 범위</span><span>담당 · 실행 기기</span><span>선행 조건</span></div>${roles.map((r,i)=>`<div class="plan-row"><div><strong>${esc(r.role)}</strong><small>${esc(r.scope)}</small></div><select aria-label="${esc(r.role)} 담당과 실행 기기" data-plan-owner="${plan.id}" data-index="${i}">${!options.some(o=>o.value===plan.assignments[i])?'<option value="" selected disabled>실행 환경 확인 필요</option>':''}${options.map(o=>`<option value="${esc(o.value)}" ${o.value===plan.assignments[i]?'selected':''}>${esc(o.label)}</option>`).join('')}</select><span class="dependency">${i===2?'구현·리뷰 결과 이후':'바로 대기열에 추가'}</span></div>`).join('')}<span class="readonly-rule">동시 실행 최대 ${p.limit} · ${p.worktree?'작업별 worktree':'공유 경로 · 범위 확인'} · ${esc(p.mode)}</span>${invalid?'<p class="red">실행 가능한 기기와 에이전트를 다시 선택해 주세요.</p>':''}<div class="actions"><button class="primary" data-action="assign-plan" data-id="${plan.id}" ${invalid?'disabled':''}>3개 작업 배정</button><button class="ghost" data-action="discard-plan" data-id="${plan.id}">배정안 닫기</button></div></section>`;}
function approvalScreen(t){return `<section class="approval-box"><div class="between"><h2>명령 실행 승인 요청</h2><span class="amber" style="font-size:12px">이번 명령만</span></div><pre>${esc(t.command||'npm test -- checkout.mobile')}</pre><p>기기: ${esc(t.device)} · 폴더: <code>${esc(t.folder||(t.worktree===false?project().path:'.worktrees/'+t.id))}</code></p><p>범위: 로컬 mock 테스트. 외부 결제·배포는 포함하지 않습니다.</p><p class="muted">허용해도 구현·리뷰 결과가 준비된 뒤 실행합니다.</p><div class="actions"><button class="primary" data-action="approve-command">이번 명령 허용</button><button data-action="deny-command">허용 안 함</button></div></section>`;}
function gitScreen(t){if(t.role==='리뷰')return '<h2>Git 변경</h2><div class="notice">읽기 전용 리뷰 작업입니다. 코드 변경을 만들지 않았습니다. 검토 의견은 작업과 결과에서 확인하세요.</div>';if(!t.files.length)return '<h2>Git 변경</h2><div class="empty">아직 제출된 변경 파일이 없습니다. 실행 전인 작업은 변경 없음과 구분합니다.</div>';const index=Math.min(selectedFile,t.files.length-1),file=t.files[index][0],patch=file.endsWith('.css')?'@@ checkout actions @@\n-.checkout-actions { gap: 24px; }\n+.checkout-actions { gap: 12px; width: 100%; }':'@@ checkout summary @@\n-<button onClick={submit}>결제</button>\n+<button disabled={pending} onClick={submit}>\n+  {pending ? "처리 중" : "결제"}\n+</button>';return `<div class="between"><h2>Git 변경</h2><span class="badge">예시 diff</span></div><p class="scope-line">${esc(t.device)} · ${t.worktree===false?'공유 프로젝트 경로':'이 작업의 독립 worktree'}</p><div class="file-list">${t.files.map((f,i)=>`<button data-action="select-file" data-index="${i}" aria-pressed="${index===i}"><code>${esc(f[0])}</code><span class="green">${esc(f[1])}</span></button>`).join('')}</div><pre class="log diff">${esc(patch)}</pre><p class="compact-note">시안용 변경 예시이며 실제 프로젝트 파일을 읽거나 수정하지 않습니다.</p>`;}
function historyRows(records){return records.length?records.map(r=>{const owner=project().tasks.find(t=>t.id===r.taskId);return `<div class="record-row"><time>${esc(r.time)}</time><div><span class="record-title">${esc(r.text)}</span><small>${owner?esc(owner.agent+' · '+owner.role+' · '+owner.device):'프로젝트 기록'}</small></div>${owner&&view!=='task'?`<button class="small" data-action="task" data-id="${esc(owner.id)}">작업 보기</button>`:''}</div>`;}).join(''):'<div class="empty">아직 이 작업의 기록이 없습니다.</div>';}
function historyScreen(){const p=project(),records=p.history.filter(r=>historyFilter==='all'||r.kind===historyFilter);return `<div class="reading"><div class="intro"><h1>프로젝트 기록</h1><p>${esc(p.name)} · 배정·승인·결과를 해당 작업과 연결합니다.</p></div><div class="history-filter">${[['all','전체'],['work','작업'],['approval','승인'],['settings','설정']].map(([id,label])=>`<button class="small" data-action="history-filter" data-id="${id}" aria-pressed="${historyFilter===id}">${label}</button>`).join('')}</div>${historyRows(records)}<p class="compact-note">모든 시각과 내용은 예시 기록입니다. 실제 실행 이력과 연결되지 않습니다.</p></div>`;}
function saveSettings(){const name=$('project-name').value.normalize('NFC').trim(),path=$('project-path').value.normalize('NFC').trim(),model=$('main-model').value.trim(),limit=Number($('parallel-limit').value),workers=[$('allow-codex').checked?'Codex':null,$('allow-claude').checked?'Claude':null].filter(Boolean);if(!name||!path||!model||!Number.isInteger(limit)||limit<1||limit>8||!workers.length){$('form-error').textContent='이름·폴더·모델, 작업자 1개 이상, 실행 한도 1~8을 확인해 주세요.';return;}const config={name,path,main:$('main-provider').value,model,effort:$('main-effort').value,limit,workers,mode:$('automation-mode').value,worktree:$('use-worktree').checked};if(newProject){const id=`project-${++sequence}`;projects[id]={...config,goal:'',tasks:[],events:[],history:[],drafts:{},plans:[]};$('project').add(new Option(name,id));projectId=id;logEvent(project(),'프로젝트를 추가했습니다.',null,'settings');}else{Object.assign(project(),config);logEvent(project(),'프로젝트 실행 규칙을 변경했습니다. 다음 배정부터 적용합니다.',null,'settings');}newProject=false;navigate('home');showToast('프로젝트 설정을 반영했습니다 · 시안');}
function assignPlan(id){const p=project(),plan=p.plans.find(v=>v.id===id);if(!plan)return;const options=executionOptions(p),owners=plan.assignments.map(value=>options.find(o=>o.value===value));if(owners.some(o=>!o)){showToast('실행 환경을 다시 확인해 주세요');return;}const batch=`batch-${++sequence}`,ids=roles.map((_,i)=>`${batch}-${i}`);roles.forEach((r,i)=>{const owner=owners[i],title=plan.goal.length>30?plan.goal.slice(0,30)+'…':plan.goal;p.tasks.push({id:ids[i],batch,goal:plan.goal,title:title+' · '+r.role,scope:r.scope,criteria:r.criteria,agent:owner.agent,role:r.role,device:owner.device,deviceId:owner.deviceId,provider:owner.agent==='Codex'?'Codex · GPT-6.1-Sol':'Claude · Opus',state:i===2?'waiting':'queued',activity:i===2?'구현과 독립 리뷰의 결과를 기다립니다.':'배정을 접수했습니다. 실행 시작은 아직 확인되지 않았습니다.',files:[],dependencies:i===2?[ids[0],ids[1]]:[],worktree:p.worktree,folder:p.worktree?'.worktrees/'+ids[i]:p.path,configuration:{limit:p.limit,mode:p.mode,effort:p.effort}});logEvent(p,`${r.role} 작업을 ${owner.agent} · ${owner.device}에 배정했습니다.`,ids[i]);});if(!p.goal)p.goal=plan.goal;p.plans=p.plans.filter(v=>v.id!==id);render();showToast('독립 작업 3개를 배정했습니다 · 실제 실행 없음');}
for(const [id,p] of Object.entries(projects)){Object.assign(p,{workers:['Codex','Claude'],limit:3,mode:'배정 전 확인',effort:'xhigh',worktree:true,plans:[],history:[]});delete p.plan;p.tasks.forEach(t=>{t.deviceId=t.device==='이 Mac'?'mac':'gpu';t.worktree=true;t.folder='.worktrees/'+t.id;t.dependencies=t.id==='test'?['ui','review']:[];});if(id==='nomorevibe'){const test=p.tasks.find(t=>t.id==='test');test.state='approval';test.command='npm test -- checkout.mobile';test.activity='모바일 mock 검증 명령의 범위 확인을 기다립니다. 구현·리뷰 결과 이후 실행합니다.';p.history=[{id:'example-review',taskId:'review',text:'리뷰 결과를 제출했습니다. 런타임 테스트는 실행하지 않았습니다.',kind:'work',time:'14:24'},{id:'example-approval',taskId:'test',text:'모바일 mock 검증 명령의 승인을 요청했습니다.',kind:'approval',time:'14:23'},{id:'example-ui',taskId:'ui',text:'결제 화면 구현을 시작했습니다.',kind:'work',time:'14:21'}];}}
devices.forEach(d=>{d.projectIds=['nomorevibe','design'];});
$('composer-form').addEventListener('submit',e=>{e.preventDefault();sendPrompt();});
$('prompt').addEventListener('input',()=>{$('send').disabled=!$('prompt').value.trim()||$('prompt').disabled;rememberDraft();});
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendPrompt();}});
$('project').addEventListener('change',e=>switchProject(e.target.value));
$('theme-preview').addEventListener('click',()=>{const light=$('app').classList.toggle('light');$('theme-preview').setAttribute('aria-pressed',String(light));$('theme-preview').textContent=light?'다크':'라이트';});
$('phone-preview').addEventListener('click',()=>{const active=$('app').classList.toggle('phone');$('phone-preview').setAttribute('aria-pressed',String(active));$('app').classList.remove('show-agents','show-workers');});
$('scenario').addEventListener('change',e=>{rememberDraft();const p=project();if(projectId!=='nomorevibe'){showToast('nomorevibe 프로젝트에서 상태 예시를 확인하세요');return;}const ui=p.tasks.find(t=>t.id==='ui'),test=p.tasks.find(t=>t.id==='test');devices.find(d=>d.id==='gpu').state=e.target.value==='offline'?'연결 끊김':'연결됨';if(e.target.value==='result'){ui.state='ready';ui.activity='결제 화면 구현 결과와 변경 파일을 제출했습니다.';test.state='queued';test.activity='구현·리뷰 결과를 받았습니다. 실행 시작을 기다립니다.';}else{ui.state='running';ui.activity='결제 화면을 수정하고 있습니다.';test.state=e.target.value==='offline'?'offline':e.target.value==='approval'?'approval':'waiting';test.activity=e.target.value==='offline'?'기기 연결이 끊겨 현재 실행 상태를 확인할 수 없습니다.':e.target.value==='approval'?'모바일 mock 테스트 명령의 범위 확인을 기다립니다.':'구현·리뷰의 결과를 기다립니다.';}render();});
document.addEventListener('change',e=>{if(e.target.dataset.planOwner){const plan=project().plans.find(p=>p.id===e.target.dataset.planOwner);if(plan)plan.assignments[Number(e.target.dataset.index)]=e.target.value;render();}else if(e.target.id==='main-provider'){$('main-model').value=e.target.value==='Codex'?'GPT-6.1-Sol':'Opus';}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='switch-project')switchProject(b.dataset.project);else if(a==='project-task')switchProject(b.dataset.project,b.dataset.id);
 else if(a==='add-project'){rememberDraft();view='settings';newProject=true;render();$('project-name').focus();}

 else if(a==='workers'){$('app').classList.remove('show-agents');$('app').classList.add('show-workers');}
 else if(a==='close-workers')$('app').classList.remove('show-workers');
 else if(a==='monitor-filter'){monitorFilter=b.dataset.id;renderMonitor();}
 else if(a==='worker-terminal'){navigate('task',b.dataset.id);detailTab='terminal';render();}
 else if(a.startsWith('nav-')){const dest=a.slice(4);if(dest==='terminal'){if(!task())taskId=project().tasks[0]?.id;if(!task()){navigate('tasks');showToast('먼저 메인에게 작업을 배정하세요');}else{navigate('task',taskId);detailTab='terminal';render();}}else navigate(dest);}
 else if(a==='home')navigate('home');else if(a==='task')navigate('task',b.dataset.id);else if(['devices','history','report'].includes(a))navigate(a);else if(a==='settings'){newProject=false;navigate('settings');}else if(a==='new-project'){newProject=true;render();$('project-name').focus();}
 else if(a==='agents'){$('app').classList.remove('show-workers');$('app').classList.toggle('show-agents');}else if(a==='close-agents')$('app').classList.remove('show-agents');
 else if(a.startsWith('detail-')){rememberDraft();detailTab=a.slice(7);render();$('content').scrollTop=0;}
 else if(a==='accept'){const t=task();if(t?.state!=='ready')return;t.state='done';logEvent(project(),`${t.title}의 결과를 사용자가 확인했습니다.`,t.id);render();showToast('결과 확인을 기록했습니다 · 시안');}
 else if(a==='rework'){$('prompt').focus();showToast('보완할 내용을 아래에 입력하세요');}
 else if(a==='approve-command'||a==='deny-command'){const t=task();if(t?.state!=='approval')return;const allowed=a==='approve-command';t.state=allowed?(t.dependencies?.some(id=>!['ready','done'].includes(project().tasks.find(v=>v.id===id)?.state))?'waiting':'queued'):'blocked';t.activity=allowed?'이번 명령을 허용했습니다. 선행 결과와 실행 시작 확인을 기다립니다.':'이번 명령을 허용하지 않았습니다. 범위를 바꿔 다시 요청할 수 있습니다.';logEvent(project(),allowed?'사용자가 이번 mock 테스트 명령을 허용했습니다. 실제 실행은 미확인입니다.':'사용자가 이번 mock 테스트 명령을 거절했습니다.',t.id,'approval');render();showToast(allowed?'이번 명령만 허용했습니다 · 시안':'명령을 허용하지 않았습니다 · 시안');}
 else if(a==='assign-plan')assignPlan(b.dataset.id);else if(a==='discard-plan'){project().plans=project().plans.filter(p=>p.id!==b.dataset.id);render();}
 else if(a==='save-settings')saveSettings();else if(a==='select-file'){selectedFile=Number(b.dataset.index);rememberDraft();render();}
 else if(a==='history-filter'){historyFilter=b.dataset.id;render();}
 else if(a==='pair-computer'||a==='pair-phone'){pairKind=a==='pair-phone'?'phone':'computer';pairStage=0;render();}else if(a==='pair-code'){pairStage=1;render();}else if(a==='pair-request'){pairStage=2;render();}else if(a==='pair-cancel'){pairStage=0;render();}
 else if(a==='pair-accept'){if(pairStage!==2)return;const phone=pairKind==='phone';devices.push({id:`demo-${++sequence}`,name:phone?'새 iPhone':'MacBook Pro',sub:phone?'iPhone · 열람·입력':'macOS · 작업 실행',cap:phone?'작업 실행 없음':'Codex',state:'연결됨',type:phone?'phone':'monitor',projectIds:[projectId]});pairStage=0;logEvent(project(),'새 기기를 이 프로젝트에 연결했습니다.',null,'settings');render();showToast('새 기기를 연결했습니다 · 시안');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('app').classList.remove('show-agents','show-workers');});
render();

</script>
