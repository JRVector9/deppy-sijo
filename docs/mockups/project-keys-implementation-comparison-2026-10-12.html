<h1>프로젝트 키 관리 · 승인 시안과 구현 대조</h1>
<p>오른쪽은 제품의 실제 egui 렌더 함수에 격리된 예시 데이터를 넣어 생성한 화면입니다. 사용자 키와 실행 중인 앱은 변경하지 않았습니다.</p>
<nav aria-label="검토 화면"><button data-view="desktop" aria-pressed="true">데스크톱 1360×900</button><button data-view="narrow" aria-pressed="false">좁은 화면 390×900</button><button data-view="edit" aria-pressed="false">수정 창 800×700</button></nav>
<div class="spec"><span>목록 행 44pt</span><span>행 버튼 28pt</span><span>일반 버튼 34pt</span><span>입력 36pt</span><span>선택 상세 폭 300pt</span><span>편집 본문 폭 480pt</span></div>
<div class="compare"><section><h2>승인 HTML 시안</h2><div class="viewport" id="proposal-wrap"><iframe id="proposal" title="승인된 프로젝트 키 HTML 시안" src="project-keys-proposal-2026-10-12.html"></iframe></div><figcaption>HTML 시안은 직접 조작할 수 있습니다. 수정 창은 시안의 수정 버튼으로 열 수 있습니다.</figcaption></section><section><h2>제품 구현 렌더</h2><div class="actual"><img id="actual" src="../qa/assets/project-keys-2026-10-12/desktop.png" alt="제품 구현 데스크톱 화면"></div><figcaption id="caption">목록·선택 상세·빌드 및 GitHub 상태</figcaption></section></div>
<p><a href="project-keys-proposal-2026-10-12.html">원본 시안</a> · <a href="../qa/2026-10-12-project-key-management-acceptance.md">요구사항별 검증 증거</a> · <a href="../project-key-management.md">사용 방법</a></p>
<script>
const sizes={desktop:[1360,900],narrow:[390,900],edit:[800,700]};let view='desktop';
const wrap=document.getElementById('proposal-wrap'),frame=document.getElementById('proposal');
function fit(){const [w,h]=sizes[view],scale=Math.min(1,wrap.clientWidth/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';wrap.style.height=h*scale+'px';}
for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>{view=button.dataset.view;for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b===button));document.getElementById('actual').src='../qa/assets/project-keys-2026-10-12/'+view+'.png';document.getElementById('actual').alt='제품 구현 '+button.textContent;document.getElementById('caption').textContent={desktop:'목록·선택 상세·빌드 및 GitHub 상태',narrow:'좁은 화면에서는 상세와 빌드를 목록 아래 배치하고 내부 스크롤을 사용합니다.',edit:'편집 창은 공용 모달·숨김 입력·고정 푸터를 사용합니다.'}[view];fit();});
new ResizeObserver(fit).observe(wrap);fit();
</script></body></html>
