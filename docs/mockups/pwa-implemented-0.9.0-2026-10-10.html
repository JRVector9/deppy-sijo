preview.srcdoc="<!doctype html>\n<html lang=\"ko\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <meta name=\"theme-color\" content=\"#1a1a1a\">\n  <title>시조새 — Deppy Sijo<\/title>\n  \n  \n  \n  <!-- iOS 설치형(홈 화면 추가) 표시 — standalone 실행 + 상태바 스타일 + 앱 이름 -->\n  <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n  <meta name=\"mobile-web-app-capable\" content=\"yes\">\n  <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n  <meta name=\"apple-mobile-web-app-title\" content=\"시조새\">\n  <!-- 자산 경로에 셸 버전 해시가 주입된다(static_srv). 구 Service Worker의 캐시 목록에\n       없는 경로라 반드시 네트워크에서 받아온다 — HTML(network-first)과 JS/CSS 버전 불일치\n       (새 화면 + 옛 스크립트) 방지. -->\n  \n<style>/* Deppy Sijo 공용 뷰어 코어 스타일 — viewer-core.js가 조작하는 요소만 담는다.\n   루프백 셸(crates/web-remote/assets/app.css)과 Relay 셸이 이 파일을 함께 쓴다.\n   특수키/작성기 같은 쓰기 경로 컨트롤 스타일은 각 셸이 자기 CSS에 둔다. */\n\n/* 터미널 뷰어 — visual viewport 전체를 채우는 독립 셸 */\nbody.viewer-open { overflow: hidden; overscroll-behavior: none; }\n.viewer-shell[hidden] { display: none; }\n.viewer-shell {\n  --viewer-top: 0px;\n  --viewer-left: 0px;\n  --viewer-width: 100vw;\n  --viewer-height: 100dvh;\n  position: fixed;\n  left: var(--viewer-left, 0px);\n  top: var(--viewer-top);\n  width: var(--viewer-width, 100vw);\n  height: var(--viewer-height, 100dvh);\n  z-index: 1000;\n  display: grid;\n  grid-template-rows: auto minmax(0, 1fr) auto;\n  min-width: 0;\n  overflow: hidden;\n  background: var(--m-bg, #050505);\n  color: var(--m-text, #f2f2f2);\n}\n.viewer-shell.viewer-has-scroll-note { grid-template-rows: auto 44px minmax(0, 1fr) auto; }\n.viewer-header {\n  display: grid;\n  grid-template-columns: 44px minmax(0, 1fr) auto;\n  align-items: center;\n  gap: 10px;\n  min-height: calc(54px + env(safe-area-inset-top));\n  padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 8px\n    max(12px, env(safe-area-inset-left));\n  border-bottom: 1px solid var(--m-line-2, #1f1f1f);\n  background: #0d0d0d;\n}\n.viewer-back {\n  width: 44px; height: 44px; border: 1px solid var(--m-line, #2a2a2a); border-radius: 12px;\n  background: #0b0b0b; color: var(--m-text, #f2f2f2); font-size: 26px;\n  line-height: 1; cursor: pointer;\n}\n.viewer-heading { min-width: 0; }\n.viewer-heading h2 { font-size: 11px; font-weight: 650; color: var(--m-muted-2, #707070); }\n.viewer-session {\n  overflow: hidden; color: var(--m-text, #f2f2f2); font-size: 14px; font-weight: 650;\n  text-overflow: ellipsis; white-space: nowrap;\n}\n.viewer-connection { color: var(--m-green, #59d185); font-size: 11px; white-space: nowrap; }\n.viewer-connection.reconnecting, .viewer-connection.paused { color: var(--m-amber, #f0b84b); }\n.viewer-stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--m-terminal, #030303); }\n.viewer-wrap {\n  position: relative; width: 100%; height: 100%; overflow: auto; overscroll-behavior: contain;\n  background: var(--m-terminal, #030303);\n}\n.viewer-wrap canvas { display: block; flex: none; touch-action: pan-x pan-y pinch-zoom; }\n.viewer-wrap.overview {\n  display: flex; align-items: center; justify-content: center; overflow: hidden;\n}\n.viewer-text-layer {\n  position: absolute; left: 0; top: 0; z-index: 1;\n  user-select: text; -webkit-user-select: text; touch-action: pan-x pan-y pinch-zoom;\n}\n.viewer-text-row {\n  height: var(--viewer-cell-height); line-height: var(--viewer-cell-height); white-space: pre;\n}\n.viewer-text-cell { display: inline-block; vertical-align: top; }\n.viewer-wrap:not(.readable) .viewer-text-cell { color: transparent !important; background: transparent !important; }\n.viewer-text-cell::selection { color: #ffffff; background: rgba(60, 120, 210, 0.7); }\n.viewer-wrap.overview .viewer-text-layer { left: 50%; top: 50%; transform: translate(-50%, -50%); }\n.viewer-wrap.readable canvas { display: none; }\n.viewer-wrap.readable .viewer-text-layer { position: relative; }\n.viewer-wrap.readable .viewer-text-row {\n  height: auto; min-height: var(--viewer-cell-height); white-space: pre-wrap; overflow-wrap: anywhere;\n}\n.viewer-wrap.readable .viewer-text-cell { display: inline; width: auto !important; vertical-align: baseline; }\n.viewer-wrap.readable .viewer-text-padding { display: none; }\n.viewer-search-marks { position: absolute; inset: 0; pointer-events: none; user-select: none; }\n.viewer-search-mark { position: absolute; background: rgba(240, 184, 75, 0.45); }\n.viewer-overlay, .viewer-privacy-curtain {\n  position: absolute; inset: 0; z-index: 3; display: flex;\n  flex-direction: column; align-items: center; justify-content: center;\n  gap: 8px; padding: 24px; text-align: center; background: rgba(5, 5, 5, 0.86);\n}\n.viewer-overlay[hidden], .viewer-privacy-curtain[hidden] { display: none; }\n.viewer-overlay span { color: var(--m-muted, #a8a8a8); font-size: 13px; }\n.viewer-privacy-curtain { z-index: 4; background: var(--m-bg, #050505); color: var(--m-muted, #a8a8a8); }\n.viewer-scroll-note {\n  position: relative; min-width: 0; height: 44px; box-sizing: border-box;\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 10px; padding: 0 10px; background: rgba(18, 18, 18, 0.92);\n  color: var(--m-muted, #a8a8a8); font-size: 12px;\n}\n.viewer-scroll-note[hidden] { display: flex; visibility: hidden; pointer-events: none; }\n.viewer-scroll-note span {\n  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\n}\n.viewer-scroll-note button {\n  flex: none; height: 44px; box-sizing: border-box;\n  padding: 6px 10px; border: 1px solid var(--m-line, #2a2a2a); border-radius: 8px;\n  background: #0b0b0b; color: var(--m-text, #f2f2f2); cursor: pointer;\n}\n\n/* Deppy Sijo 모바일 공용 테마 — deppy-mux 모바일 PWA와 같은 디자인 언어.\n *\n * 토큰과 화면 부품(상단바·알약·카드·칩·토스트·메뉴·터미널 헤더·작성기 바)만 담는다.\n * 루프백 셸(crates/web-remote/assets)과 Relay 셸(web/relay-shell)이 이 파일을 함께 쓴다.\n * 이름은 전부 `m-` 접두사다 — 각 셸이 이미 가진 클래스(.dot, .badge, .composer …)와 겹치지\n * 않게 하려는 것이며, 기존 규칙을 덮어쓰지 않는다. 인라인 스타일은 쓰지 않는다(CSP style-src\n * 'self'). */\n\n:root {\n  color-scheme: dark;\n  --m-bg: #050505;\n  --m-panel: #101010;\n  --m-panel-2: #161616;\n  --m-line: #2a2a2a;\n  --m-line-2: #1f1f1f;\n  --m-text: #f2f2f2;\n  --m-muted: #a8a8a8;\n  --m-muted-2: #707070;\n  --m-accent: #f5f5f5;\n  --m-accent-text: #080808;\n  --m-green: #59d185;\n  --m-amber: #f0b84b;\n  --m-red: #ef6b73;\n  --m-blue: #77a8ff;\n  --m-terminal: #030303;\n  --m-terminal-line: #181818;\n  --m-mono: ui-monospace, \"SF Mono\", SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\",\n    \"D2Coding\", monospace;\n  --m-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Apple SD Gothic Neo\",\n    \"Segoe UI\", sans-serif;\n}\n\n/* ── 화면 골격 ───────────────────────────────────────────────────────────────── */\n\n/* `hidden` 속성은 UA 규칙 `[hidden]{display:none}`으로 감춰지는데, 아래 저자 규칙의\n   `display`가 오리진 우선순위상 그것을 무조건 이긴다. 그래서 `display`를 주는 모든 부품에\n   `[hidden]` 가드를 함께 둔다 — viewer-core.css가 같은 이유로 하는 것과 같다. */\n.m-screen[hidden],\n.m-term-shell[hidden],\n.m-card-list[hidden],\n.m-composer-bar[hidden],\n.m-toast[hidden],\n.m-quick-actions[hidden] {\n  display: none;\n}\n\n.m-screen {\n  display: flex;\n  min-height: 0;\n  flex: 1;\n  flex-direction: column;\n  padding: max(14px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));\n  background: var(--m-bg);\n  color: var(--m-text);\n  font-family: var(--m-sans);\n}\n\n.m-topbar {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  align-items: center;\n  gap: 10px;\n  min-height: 44px;\n  padding: 0 2px;\n}\n\n.m-topbar-actions {\n  display: flex;\n  min-width: 0;\n  align-items: center;\n  gap: 8px;\n}\n\n.m-brand {\n  min-width: 0;\n}\n\n.m-brand-title {\n  overflow: hidden;\n  margin: 0;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-size: 18px;\n  font-weight: 650;\n  letter-spacing: 0;\n  color: var(--m-text);\n}\n\n.m-brand-subtitle {\n  margin-top: 2px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  color: var(--m-muted);\n  font-size: 12px;\n}\n\n/* ── 원자 부품 ───────────────────────────────────────────────────────────────── */\n\n.m-icon-button {\n  display: grid;\n  width: 38px;\n  height: 38px;\n  place-items: center;\n  border: 1px solid var(--m-line);\n  border-radius: 12px;\n  background: #0b0b0b;\n  color: var(--m-text);\n  font: inherit;\n  font-weight: 650;\n  cursor: pointer;\n  -webkit-tap-highlight-color: transparent;\n}\n\n.m-icon-button.small {\n  width: 30px;\n  height: 30px;\n  border-radius: 9px;\n  font-size: 15px;\n}\n\n.m-icon-button.round {\n  width: 28px;\n  height: 28px;\n  border-radius: 999px;\n  background: var(--m-panel);\n  font-size: 16px;\n  line-height: 1;\n}\n\n.m-icon-button:disabled {\n  opacity: 0.45;\n  cursor: default;\n}\n\n.m-pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  width: fit-content;\n  min-height: 26px;\n  border: 1px solid var(--m-line);\n  border-radius: 999px;\n  padding: 4px 9px;\n  background: #0d0d0d;\n  color: var(--m-muted);\n  font-size: 12px;\n  white-space: nowrap;\n}\n\n.m-dot {\n  display: inline-block;\n  width: 7px;\n  height: 7px;\n  flex: none;\n  border-radius: 50%;\n  background: var(--m-muted-2);\n}\n\n.m-dot.green {\n  background: var(--m-green);\n  box-shadow: 0 0 12px rgba(89, 209, 133, 0.55);\n}\n\n.m-dot.amber {\n  background: var(--m-amber);\n  box-shadow: 0 0 12px rgba(240, 184, 75, 0.45);\n}\n\n.m-dot.red {\n  background: var(--m-red);\n  box-shadow: 0 0 12px rgba(239, 107, 115, 0.45);\n}\n\n.m-dot.blue {\n  background: var(--m-blue);\n}\n\n.m-done-tag {\n  display: inline-flex;\n  margin-top: 4px;\n  border-radius: 999px;\n  padding: 2px 8px;\n  background: var(--m-green);\n  color: #04130a;\n  font-size: 11px;\n  font-weight: 700;\n  line-height: 1;\n}\n\n/* ── 워크스페이스 카드 목록 ─────────────────────────────────────────────────── */\n\n.m-card-list {\n  display: flex;\n  flex: 1;\n  min-height: 0;\n  flex-direction: column;\n  gap: 10px;\n  overflow-y: auto;\n  padding: 12px 0 4px;\n  -webkit-overflow-scrolling: touch;\n}\n\n.m-card {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  gap: 12px;\n  width: 100%;\n  border: 1px solid var(--m-line);\n  border-radius: 10px;\n  padding: 13px;\n  background: linear-gradient(180deg, #151515, #101010);\n  color: var(--m-text);\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n  -webkit-tap-highlight-color: transparent;\n}\n\n.m-card:active {\n  transform: translateY(1px);\n}\n\n.m-card.idle {\n  cursor: default;\n}\n\n.m-card-body {\n  min-width: 0;\n}\n\n.m-card-name {\n  display: block;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-size: 16px;\n  font-weight: 650;\n}\n\n.m-card-path {\n  display: block;\n  margin-top: 5px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  color: var(--m-muted);\n  font-family: var(--m-mono);\n  font-size: 12px;\n}\n\n.m-chip-row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px;\n  margin-top: 10px;\n}\n\n.m-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  max-width: 100%;\n  border: 1px solid #333;\n  border-radius: 999px;\n  padding: 4px 7px;\n  color: #dcdcdc;\n  font-size: 11px;\n  line-height: 1;\n}\n\n.m-chip > span:last-child {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.m-badge-count {\n  align-self: start;\n  min-width: 28px;\n  border-radius: 999px;\n  padding: 5px 7px;\n  background: var(--m-accent);\n  color: var(--m-accent-text);\n  font-size: 12px;\n  font-weight: 700;\n  text-align: center;\n}\n\n.m-panel-note {\n  border: 1px solid var(--m-line);\n  border-radius: 10px;\n  padding: 14px;\n  background: var(--m-panel);\n  color: var(--m-muted);\n  font-size: 14px;\n  line-height: 1.45;\n}\n\n.m-panel-note strong {\n  display: block;\n  margin-bottom: 4px;\n  color: var(--m-text);\n  font-size: 14px;\n  font-weight: 650;\n}\n\n/* ── 터미널 화면 ────────────────────────────────────────────────────────────── */\n\n.m-term-shell {\n  display: flex;\n  flex: 1;\n  min-height: 0;\n  flex-direction: column;\n  background: var(--m-terminal);\n}\n\n.m-term-head {\n  display: grid;\n  grid-template-columns: 30px minmax(0, 1fr) auto;\n  align-items: center;\n  gap: 8px;\n  min-height: 40px;\n  border-bottom: 1px solid var(--m-line-2);\n  padding: max(5px, env(safe-area-inset-top)) 8px 6px;\n  background: #0d0d0d;\n}\n\n.m-term-title {\n  min-width: 0;\n}\n\n.m-term-title-row {\n  display: flex;\n  min-width: 0;\n  align-items: center;\n  gap: 8px;\n}\n\n.m-term-name {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-size: 13px;\n  font-weight: 620;\n  color: #e7e7e7;\n}\n\n.m-term-status {\n  margin-top: 2px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  color: #8e8e8e;\n  font-size: 11px;\n  line-height: 1;\n}\n\n.m-term-actions {\n  display: flex;\n  min-width: 0;\n  align-items: center;\n  gap: 4px;\n}\n\n.m-term-chip {\n  height: 28px;\n  max-width: 6rem;\n  overflow: hidden;\n  border: 1px solid var(--m-line);\n  border-radius: 999px;\n  padding: 2px 8px;\n  background: var(--m-panel);\n  color: var(--m-muted);\n  font: inherit;\n  font-size: 11px;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  cursor: pointer;\n}\n\n.m-term-chip:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n/* DOM 행 렌더러의 화면 영역. 실제 행/커서 스타일은 relay-terminal.js가 만든 요소에 붙는다. */\n.m-term-viewport {\n  position: relative;\n  flex: 1;\n  min-width: 0;\n  min-height: 0;\n  overflow: auto;\n  overscroll-behavior: contain;\n  background: var(--m-terminal);\n  color: #e7e7e7;\n  font-family: var(--m-mono);\n  -webkit-overflow-scrolling: touch;\n}\n\n.m-term-grid {\n  position: relative;\n  display: block;\n  min-width: 0;\n  max-width: 100%;\n  overflow: hidden;\n  font-family: var(--m-mono);\n  font-variant-ligatures: none;\n  letter-spacing: 0;\n  line-height: 1.35;\n}\n\n.m-term-grid.fit {\n  width: 100%;\n}\n\n.m-term-row {\n  height: 1.35em;\n  white-space: pre;\n}\n\n.m-term-grid.wrap {\n  width: 100%;\n  padding: 12px;\n}\n\n.m-term-grid.wrap .m-term-row {\n  height: auto;\n  min-height: 1.35em;\n  overflow-wrap: anywhere;\n  white-space: pre-wrap;\n  word-break: break-word;\n}\n\n.m-term-cursor {\n  pointer-events: none;\n  position: absolute;\n  width: 1ch;\n  height: 1.35em;\n  background: #e7e7e7;\n  opacity: 0.8;\n  mix-blend-mode: difference;\n}\n\n.m-term-cursor.beam {\n  width: 1px;\n  opacity: 1;\n  mix-blend-mode: normal;\n}\n\n.m-term-cursor.underline {\n  height: 2px;\n  opacity: 1;\n  mix-blend-mode: normal;\n}\n\n.m-term-cursor.blink {\n  animation: m-blink 1.06s ease-in-out infinite;\n}\n\n@keyframes m-blink {\n  0%, 55% { opacity: 0.8; }\n  65%, 90% { opacity: 0; }\n  100% { opacity: 0.8; }\n}\n\n.m-term-empty {\n  padding: 12px;\n  color: #8e8e8e;\n  font-family: var(--m-sans);\n  font-size: 14px;\n}\n\n.m-term-scroll-note {\n  position: absolute;\n  inset-inline: 10px;\n  top: 8px;\n  z-index: 2;\n  border: 1px solid var(--m-line);\n  border-radius: 8px;\n  padding: 6px 10px;\n  background: rgba(16, 16, 16, 0.92);\n  color: var(--m-muted);\n  font-family: var(--m-sans);\n  font-size: 12px;\n}\n\n.m-term-scroll-note[hidden] {\n  display: none;\n}\n\n/* ── 작성기 바 (보기 전용 셸에서는 비활성 상태로 놓인다) ─────────────────────── */\n\n.m-composer-bar {\n  flex: none;\n  border-top: 1px solid var(--m-line-2);\n  background: #0a0a0a;\n  padding: 6px 8px max(6px, env(safe-area-inset-bottom));\n}\n\n.m-composer {\n  display: grid;\n  grid-template-columns: 30px 30px minmax(0, 1fr) 34px;\n  align-items: center;\n  gap: 5px;\n  min-width: 0;\n}\n\n.m-composer input,\n.m-composer textarea {\n  min-width: 0;\n  height: 30px;\n  border: 1px solid var(--m-line);\n  border-radius: 8px;\n  outline: none;\n  background: var(--m-bg);\n  color: var(--m-text);\n  padding: 0 8px;\n  font: inherit;\n  font-size: 14px;\n  line-height: 28px;\n  resize: none;\n}\n\n.m-composer input:focus,\n.m-composer textarea:focus {\n  border-color: #5b5b5b;\n}\n\n.m-composer input:disabled,\n.m-composer textarea:disabled {\n  opacity: 0.6;\n}\n\n.m-send-button {\n  display: grid;\n  width: 34px;\n  height: 30px;\n  place-items: center;\n  border: 0;\n  border-radius: 8px;\n  background: var(--m-accent);\n  color: var(--m-accent-text);\n  font: inherit;\n  font-weight: 800;\n  cursor: pointer;\n}\n\n.m-send-button:disabled {\n  opacity: 0.4;\n  cursor: default;\n}\n\n.m-composer-note {\n  margin: 0 0 6px;\n  border: 1px solid var(--m-line);\n  border-radius: 8px;\n  padding: 6px 8px;\n  background: #151515;\n  color: var(--m-muted);\n  font-size: 12px;\n  line-height: 1.35;\n}\n\n.m-composer-note.error {\n  border-color: #5a2d2d;\n  background: #211010;\n  color: #ffb6b6;\n}\n\n.m-quick-actions {\n  display: flex;\n  gap: 8px;\n  padding: 8px 0 0;\n  overflow-x: auto;\n  -webkit-overflow-scrolling: touch;\n}\n\n.m-quick-action {\n  flex: none;\n  min-height: 32px;\n  border: 1px solid var(--m-line);\n  border-radius: 999px;\n  padding: 6px 10px;\n  background: var(--m-panel);\n  color: var(--m-muted);\n  font: inherit;\n  font-family: var(--m-mono);\n  font-size: 12px;\n  cursor: pointer;\n}\n\n.m-quick-action:active {\n  background: #1a1a1a;\n}\n\n/* ── 토스트 ─────────────────────────────────────────────────────────────────── */\n\n.m-toast-stack {\n  pointer-events: none;\n  position: absolute;\n  left: 10px;\n  right: 10px;\n  top: max(12px, env(safe-area-inset-top));\n  z-index: 30;\n  display: grid;\n  gap: 8px;\n}\n\n.m-toast {\n  display: none;\n  align-items: center;\n  gap: 9px;\n  border: 1px solid rgba(255, 255, 255, 0.16);\n  border-radius: 12px;\n  padding: 10px;\n  background: rgba(18, 18, 18, 0.92);\n  box-shadow: 0 14px 42px rgba(0, 0, 0, 0.45);\n  backdrop-filter: blur(14px);\n  font-size: 13px;\n}\n\n.m-toast.visible {\n  display: flex;\n}\n\n.m-toast.success {\n  border-color: rgba(89, 209, 133, 0.25);\n  background: rgba(13, 32, 21, 0.95);\n}\n\n.m-toast-title {\n  display: block;\n  font-size: 13px;\n  font-weight: 650;\n}\n\n.m-toast-body {\n  display: block;\n  margin-top: 2px;\n  color: var(--m-muted);\n  font-size: 12px;\n}\n\n/* ── ⋯ 메뉴 패널 ────────────────────────────────────────────────────────────── */\n\n.m-menu {\n  position: absolute;\n  right: 8px;\n  top: calc(max(8px, env(safe-area-inset-top)) + 38px);\n  z-index: 40;\n  width: min(15.5rem, calc(100vw - 1rem));\n  border: 1px solid var(--m-line);\n  border-radius: 12px;\n  padding: 6px;\n  background: rgba(16, 16, 16, 0.98);\n  box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);\n  color: var(--m-text);\n  font-size: 12px;\n}\n\n.m-menu[hidden] {\n  display: none;\n}\n\n.m-menu-section {\n  margin-bottom: 4px;\n  border-radius: 8px;\n  padding: 6px 10px;\n  background: var(--m-bg);\n  color: var(--m-muted);\n  font-size: 11px;\n}\n\n.m-menu-section .label {\n  font-weight: 600;\n  letter-spacing: 0;\n  text-transform: uppercase;\n  color: #737373;\n}\n\n.m-menu-section .value {\n  margin-top: 2px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  color: var(--m-text);\n  font-size: 12px;\n  font-weight: 600;\n}\n\n.m-menu-button {\n  display: grid;\n  width: 100%;\n  margin-bottom: 4px;\n  border: 1px solid var(--m-line);\n  border-radius: 8px;\n  padding: 6px 10px;\n  background: #0b0b0b;\n  color: var(--m-text);\n  font: inherit;\n  font-size: 12px;\n  font-weight: 600;\n  text-align: left;\n  cursor: pointer;\n}\n\n.m-menu-button.primary {\n  border-color: transparent;\n  background: var(--m-accent);\n  color: var(--m-accent-text);\n}\n\n.m-menu-button:disabled {\n  opacity: 0.45;\n  cursor: default;\n}\n\n.m-menu-row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 8px;\n  padding: 0 4px;\n  color: var(--m-muted);\n  font-size: 11px;\n}\n\n.m-menu-row .mono {\n  flex: none;\n  font-family: var(--m-mono);\n}\n\n.m-menu-steps {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  margin-top: 4px;\n}\n\n.m-menu-steps button {\n  height: 28px;\n  border: 1px solid var(--m-line);\n  border-radius: 6px;\n  background: var(--m-panel);\n  color: var(--m-text);\n  font: inherit;\n  font-size: 12px;\n  font-weight: 700;\n  cursor: pointer;\n}\n\n.m-menu-toggle {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) 3.25rem;\n  align-items: center;\n  gap: 8px;\n  width: 100%;\n  height: 32px;\n  margin-bottom: 4px;\n  border: 1px solid var(--m-line);\n  border-radius: 8px;\n  padding: 0 10px;\n  background: #0b0b0b;\n  color: var(--m-text);\n  font: inherit;\n  font-size: 12px;\n  font-weight: 600;\n  text-align: left;\n  cursor: pointer;\n}\n\n.m-menu-toggle .state {\n  border-radius: 999px;\n  padding: 2px 6px;\n  background: var(--m-line);\n  color: var(--m-text);\n  font-size: 10px;\n  font-weight: 800;\n  text-align: center;\n}\n\n.m-menu-toggle[aria-pressed=\"true\"] .state {\n  background: var(--m-green);\n  color: #04140b;\n}\n\n.m-menu-version {\n  border-radius: 8px;\n  padding: 6px 10px;\n  background: var(--m-bg);\n  color: var(--m-muted);\n  font-size: 11px;\n  font-weight: 600;\n}\n\n/* ── 하단 시트 ──────────────────────────────────────────────────────────────── */\n\n.m-sheet {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  z-index: 20;\n  max-height: 58%;\n  border-top: 1px solid var(--m-line);\n  border-radius: 18px 18px 0 0;\n  background: var(--m-panel);\n  box-shadow: 0 -18px 46px rgba(0, 0, 0, 0.5);\n  overflow: hidden;\n}\n\n.m-sheet[hidden] {\n  display: none;\n}\n\n.m-sheet-head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  border-bottom: 1px solid var(--m-line);\n  padding: 12px 14px;\n  font-size: 13px;\n  font-weight: 650;\n}\n\n.m-sheet-list {\n  display: grid;\n  gap: 1px;\n  max-height: 320px;\n  overflow-y: auto;\n  background: var(--m-line);\n}\n\n.m-sheet-item {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  gap: 12px;\n  border: 0;\n  padding: 12px 14px;\n  background: var(--m-panel);\n  color: var(--m-text);\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n}\n\n.m-sheet-item .name {\n  font-family: var(--m-mono);\n  font-size: 13px;\n}\n\n.m-sheet-item .desc {\n  display: block;\n  margin-top: 3px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  color: var(--m-muted);\n  font-size: 12px;\n}\n\n/* Deppy Sijo 모바일 웹(Tailscale 경로) — Relay 셸과 **같은 디자인 언어**를 쓴다.\n *\n * 토큰과 공용 부품은 `web/shared/mobile-theme.css`가 소유하고(서빙 번들에서 이 파일 앞에\n * 이어 붙는다), 여기에는 이 셸만의 요소(승인 카드·워크스페이스 목록·특수키·작성기·설치\n * 안내)를 그 토큰으로 그린 규칙만 둔다. 클래스 이름은 그대로다 — app.js의 DOM 구성은\n * 바뀌지 않았고, 바뀐 것은 생김새뿐이다. */\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { min-height: 100%; }\nbody {\n  background: var(--m-bg);\n  color: var(--m-text);\n  font-family: var(--m-sans);\n  padding: max(14px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));\n}\n\n/* P1 페어링/셸 카드(pairing.html) */\n.card {\n  width: 100%; max-width: 420px; margin: 24px auto;\n  background: var(--m-panel); border: 1px solid var(--m-line); border-radius: 12px;\n  padding: 24px 20px;\n}\n.placeholder { font-size: 14px; color: var(--m-muted); line-height: 1.6; margin-bottom: 18px; }\n.hint { font-size: 12px; color: var(--m-muted-2); }\n.hidden { display: none; }\n.sr-only {\n  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;\n  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;\n}\n\n/* 공통 브랜드/상태 — deppy-mux 상단바(제목 + 부제 + 상태 알약) */\n.brand {\n  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;\n  align-items: center; gap: 10px; min-height: 44px; margin-bottom: 4px;\n}\n.brand img { border-radius: 9px; width: 30px; height: 30px; }\nh1 { font-size: 18px; font-weight: 650; color: var(--m-text); }\n.status {\n  display: inline-flex; align-items: center; gap: 6px; width: fit-content; min-height: 26px;\n  border: 1px solid var(--m-line); border-radius: 999px; padding: 4px 9px;\n  background: #0d0d0d; color: var(--m-muted); font-size: 12px; white-space: nowrap;\n}\n.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--m-muted-2); display: inline-block; flex: none; }\n.dot.ok { background: var(--m-green); box-shadow: 0 0 12px rgba(89, 209, 133, 0.55); }\n.dot.bad { background: var(--m-red); box-shadow: 0 0 12px rgba(239, 107, 115, 0.45); }\n\n/* P2 대시보드 */\n.app { width: 100%; max-width: 560px; margin: 0 auto; }\n.panel { margin-top: 14px; }\n.panel h2 {\n  font-size: 13px; font-weight: 650; color: var(--m-muted); margin-bottom: 10px;\n  display: flex; align-items: center; gap: 8px; letter-spacing: 0;\n}\n.count {\n  font-size: 11px; font-weight: 700; min-width: 20px; text-align: center;\n  background: var(--m-accent); color: var(--m-accent-text); border-radius: 999px; padding: 2px 7px;\n}\n.empty { font-size: 13px; color: var(--m-muted-2); }\n\n/* 승인 카드 — 목록에서 가장 눈에 띄어야 하므로 앰버 강조선을 유지한다. */\n.cards { display: flex; flex-direction: column; gap: 10px; }\n.cards:empty { display: none; }\n.approval-card {\n  background: linear-gradient(180deg, #151515, #101010);\n  border: 1px solid var(--m-line); border-left: 3px solid var(--m-amber);\n  border-radius: 10px; padding: 13px;\n}\n.approval-card.resolving { opacity: 0.5; }\n.card-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }\n.card-head .server { font-size: 11px; color: var(--m-muted-2); }\n.card-head .tool { font-size: 15px; font-weight: 650; color: var(--m-text); word-break: break-word; }\n.approval-session { font-size: 12px; color: var(--m-blue); margin-bottom: 8px; word-break: break-word; }\n.approval-view {\n  font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px;\n  background: var(--m-panel); color: var(--m-muted); border: 1px soli n      if (width + cells > cols) { result.push([line, fg]); line = ''; width = 0; }\n      line += character; width += cells;\n    }\n    result.push([line, fg]); return result;\n  });\n  class PreviewSocket {\n    static OPEN = 1;\n    static CONNECTING = 0;\n    constructor() { this.readyState = 0; this.events = new Map(); this.watching = null; window.previewSocket = this; setTimeout(() => { if (!offline) this.open(); }, 25); }\n    addEventListener(name, cb) { this.events.set(name, [...(this.events.get(name) || []), cb]); }\n    emit(name, event = {}) { (this.events.get(name) || []).forEach(cb => cb(event)); }\n    message(data) { if (this.readyState === 1) this.emit('message', { data: JSON.stringify(data) }); }\n    open() { this.readyState = 1; this.emit('open'); }\n    dashboard() { this.message({ type: 'dashboard', workspaces: workspaces(), resource: { cpu: 8, rss_mb: 240 } }); }\n    frame(session, offset = 0, request) {\n      let content = sample(session);\n      if (cols < 120) content = reflow(content);\n      if (offset) content = [ ['이전 출력 · ' + offset + '행 위', '#f0b84b'], ['', '#f2f2f2'], ...Array.from({ length: 10 }, (_, i) => ['  ✓ 검증 기록 ' + (240 - offset + i) + ' · 통과', '#59d185']), ['', '#f2f2f2'], ...content ];\n      const begin = Math.max(0, content.length - rows);\n      content = content.slice(begin);\n      this.message({ type: 'viewport', session, keyframe: true, cols, rows, offset,\n        lines: Array.from({ length: rows }, (_, row) => ({ row, runs: content[row] ? [{ s: 0, t: content[row][0], fg: content[row][1] }] : [] })),\n        cursor: { visible: !offset, row: Math.min(content.length - 1, rows - 1), col: Math.min(2 + [...prompt].reduce((n, c) => n + cellWidth(c), 0), cols - 1) },\n        history: { generation: '1', first_line: String(10000 - offset), total_lines: 240, ...(request ? { request } : {}), expired: false }\n      });\n    }\n    send(raw) {\n      const m = JSON.parse(raw);\n      if (m.type === 'auth') setTimeout(() => nst style = document.createElement('style'); style.textContent = '#preview-keyboard{position:fixed;z-index:2000;bottom:0;left:0;width:100%;height:284px;background:#252629;border-top:1px solid #45464b;padding:10px 5px;color:#ddd;font:18px system-ui}#preview-keyboard[hidden]{display:none}#preview-keyboard p{font-size:11px;color:#acafb4;text-align:center;margin-bottom:12px}#preview-keyboard div{display:flex;justify-content:center;gap:4px;margin-bottom:8px}#preview-keyboard span{flex:1;max-width:44px;min-width:24px;text-align:center;border-radius:5px;padding:9px 0;background:#55565a}'; document.head.append(style);\n  window.previewApplyScenario = name => {\n    if (offline && name !== 'reconnect') { offline = false; if (window.previewSocket.readyState !== 1) window.previewSocket.open(); }\n    window.previewKeyboard = name === 'keyboard'; keyboard.hidden = !window.previewKeyboard;\n    viewport.dispatchEvent(new Event('resize'));\n    const byId = id => document.getElementById(id);\n    if (name === 'list') { if (!byId('viewer').hidden) byId('viewer-back').click(); return; }\n    if (byId('viewer').hidden) document.querySelector('.ws-open')?.click();\n    if (name === 'reconnect') { offline = true; window.previewSocket.close(); return; }\n    if (name === 'settings') { if (byId('viewer-menu').hidden) byId('viewer-menu-button').click(); return; }\n    const readable = byId('viewer-readable-wrap');\n    if ((readable.getAttribute('aria-pressed') === 'true') !== (name === 'reading')) readable.click();\n    if (name === 'reading') byId('viewer-mode-composer').click();\n    else if (name === 'composer' || name === 'keyboard') {\n      byId('viewer-mode-composer').click();\n      byId('composer-text').value = '검증 결과를 요약해줘.\\n변경 파일과 남은 작업도 정리해줘.';\n      byId('composer-text').dispatchEvent(new Event('input', { bubbles: true }));\n    } else byId('viewer-mode-direct').click();\n    if (!byId('viewer-menu').hidden) byId('viewer-menu-button').click();\n  };\n  window.addEventList endingWatch(msg.session);\n        consumePendingWatch(lastSessions);\n      }\n    });\n  }\n\n  let lastSessions = [];   // 시청 가능한 세션(활성 워크스페이스)\n  let lastWorkspaces = [];\n  let lastResource = null; // 재렌더 시 CPU/RAM 줄이 깜빡 사라지지 않게 보관\n\n  /// 딥링크 대상이 현재 세션 목록에 있으면 시청을 시작한다(1회성).\n  function consumePendingWatch(sessions) {\n    if (!pendingWatch) return false;\n    if (Date.now() > pendingWatchDeadline) {\n      pendingWatch = null;\n      return false;\n    }\n    if (viewer.closing) return false;\n    if (pendingWatch === viewer.watching) {\n      pendingWatch = null;\n      return true;\n    }\n    const target = sessions.find((session) => session.id === pendingWatch);\n    if (!target || target.exited) {\n      if (target && target.exited) pendingWatch = null;\n      return false;\n    }\n    const id = pendingWatch;\n    if (!openViewer(id, target.title || ('세션 ' + id))) return false;\n    pendingWatch = null;\n    return true;\n  }\n\n  const WORKSPACE_STATE_LABEL = { active: '활성', warm: '대기', suspended: '절전' };\n\n  // 미러 진입 안내 배너(I1b-2). 서버가 Dashboard 프레임에 실어 보내는 일시 안내(전환 상한\n  // 초과 등)를 표시한다. 서버가 TTL 동안 같은 안내를 반복해 보내도 내용이 바뀔 때만 한 번\n  // 띄우고, 클라 타이머로 몇 초 뒤 자동으로 숨긴다. 내용은 textContent로만 삽입한다.\n  let lastNotice = null;\n  let noticeTimer = null;\n  function showNotice(text) {\n    if (!text) {\n      lastNotice = null; // 서버가 내림 — 다음에 같은 문구가 와도 다시 뜨게 리셋\n      return;\n    }\n    if (text === lastNotice) return; // 같은 안내 반복 표시 방지\n    lastNotice = text;\n    noticeBanner.textContent = text;\n    noticeBanner.hidden = false;\n    if (noticeTimer) clearTimeout(noticeTimer);\n    noticeTimer = setTimeout(() => {\n      noticeBanner.hidden = true;\n    }, 6000);\n  }\n\n  // 워크스페이스별 세션 목록. 활성 워크스페이스의 세션만 id가 있어 시청/입력이 가능하고,\n  // 대기/절전은 표시 전용이다(세션 id가 worker-로컬이라 다른 워크스페이스 id로 시청하면\n  // 엉뚱한 세션이 잡힌다 — 서버가 id 자체를 안 보낸다). 이름은 데스크톱 활동 패널과 같은\n  // 프로젝트명 규칙으로 서버가 해석해 보낸다.\n  function renderWorkspaces(workspaces, resource) {\n    lastWorkspaces = workspaces;\n    workspaceCount.textContent = workspaces.length + ' 워크스페이스';\n    if (viewer.watching) updateViewerHeading(viewer.watching);\n    if (resource) lastResource = resource;\n    lastSessions = workspaces.flatMap((ws) => ws.sessions || []).filter((s) => s.id);\n    for (const session of lastSessions) {\n      if (session.exited) discardSessionDraft(session.id);\n    }\n    const endedSession = viewer.watching;\n    const watched = endedSession\n      ? lastSessions.find((session) => session.id === endedSession)\n      : null;\n    if (endedSession && (!watched || watched.exited)) {\n      queueMicrotask(() => {\n        if (viewer.watching !== endedSession) return;\n        requestCloseViewer({\n          rerender: true,\n          notice: '선택한 세션이 종료되었습니다 — 세션 목록으로 돌아왔습니다.',\n          discardDraft: !!(watched && watched.exited),\n        });\n      });\n    }\n    // 그룹별로 \"세션 없음\"을 표시하므로, 전역 안내는 워크스페이스가 하나도 없을 때만.\n    sessionsEmpty.hidden = workspaces.length > 0;\n    sessionsEl.textContent = '';\n\n    for (const ws of workspaces) {\n      const group = document.createElement('li');\n      group.className = 'ws-group m-card';\n\n      const head = document.createElement('div');\n      head.className = 'ws-head m-card-body';\n      const open = document.createElement('button');\n      open.type = 'button';\n      open.className = 'ws-open';\n      const name = document.createElement('span');\n      name.className = 'ws-name m-card-name';\n      name.textContent = ws.name || ws.id;\n      open.appendChild(name);\n      const firstSession = (ws.sessions || []).find((session) => session.id && !session.exited);\n      open.disabled = ws.state === 'active' && !firstSession;\n      open.addEventListener('click', () => {\n        if (ws.state === 'active' && firstSession) openViewer(firstSession.id, firstSession.title || '세션');\n        else if (ws.state !== 'active') send({ type: 'switch', workspace: ws.id });\n      });\n      group.addEventListener('click', (event) => {\n        if (!event.target.closest('button, .ws-sessions')) open.click();\n      });\n      head.appendChild(open);\n      if (ws.current_directory) {\n        const path = document.createElement('span');\n        path.className = 'ws-path m-card-path';\n        path.textContent = ws.current_directory;\n        head.appendChild(path);\n      }\n      const state = document.createElement('span');\n      state.className = 'ws-state ' + (ws.state || 'suspended');\n      state.textContent = WORKSPACE_STATE_LABEL[ws.state] || ws.state || '';\n      head.appendChild(state);\n      // 비활성(대기/절전) 워크스페이스는 \"이어서 작업\" — 데스크탑 active를 이 워크스페이스로\n      // 전환시켜(하드 미러) 폰에서 그대로 이어서 작업한다. 대기는 즉시, 절전은 깨우기.\n      // 낙관적 disable은 하지 않는다 — 성공하면 프레임이 active로 바뀌어 버튼이 사라지고,\n      // 상한 초과로 거부되면 서버 notice 배너가 사유를 알린다(둘 다 재렌더로 자연 반영).\n      if (ws.state && ws.state !== 'active') {\n        const enter = document.createElement('button');\n        enter.type = 'button';\n        enter.className = 'ws-enter';\n        enter.textContent = '이어서 작업';\n        enter.addEventListener('click', () => {\n          send({ type: 'switch', workspace: ws.id });\n        });\n        head.appendChild(enter);\n      }\n      const count = document.createElement('span');\n      count.className = 'm-badge-count';\n      count.textContent = String((ws.sessions || []).length);\n      group.appendChild(head);\n      group.appendChild(count);\n\n      const list = document.createElement('ul');\n      list.className = 'ws-sessions m-chip-row';\n      for (const s of ws.sessions || []) {\n        list.appendChild(sessionRow(s, ws));\n      }\n      if (!(ws.sessions || []).length) {\n        const empty = document.createElement('p');\n        empty.className = 'empty';\n        empty.textContent = '세션 없음';\n        group.appendChild(empty);\n      }\n      group.appendChild(list);\n      sessionsEl.appendChild(group);\n    }\n\n    if (resource) {\n      const cpu = resource.cpu != null ? resource.cpu.toFixed(0) + '%' : '—';\n      resourceEl.textContent = 'CPU ' + cpu + ' · RAM ' + (resource.rss_mb || 0) + 'MB';\n    } else {\n      resourceEl.textContent = '';\n    }\n    // 알림 딥링크 대기분이 있으면 목록 도착 시점에 소비한다 (P6c).\n    consumePendingWatch(lastSessions);\n  }\n\n  function sessionRow(s, ws) {\n    const li = document.createElement('li');\n    li.className = 'session m-chip';\n\n    // 이름 + (있으면) 돌고 있는 에이전트 요약 — 2줄. 둘 다 textContent로만 삽입한다.\n    const nameBox = document.createElement('span');\n    nameBox.className = 'session-name';\n    const title = document.createElement('span');\n    title.className = 'title';\n    title.textContent = s.title || '세션';\n    nameBox.appendChild(title);\n    if (s.agent) {\n      const agent = document.createElement('span');\n      agent.className = 'agent';\n      agent.textContent = s.agent;\n      nameBox.appendChild(agent);\n    }\n    li.appendChild(nameBox);\n\n    // 상태는 활성 워크스페이스만 감지된다(warm/유휴는 감지 워커가 안 돈다).\n    if (s.exited || s.status) {\n      const badge = document.createElement('span');\n      const status = s.exited ? 'done' : s.status;\n      badge.className = 'badge ' + status;\n      badge.textContent = STATUS_LABEL[status] || status;\n      li.appendChild(badge);\n    }\n\n    if (s.id && !s.exited) {\n      const viewBtn = document.createElement('button');\n      viewBtn.type = 'button';\n      viewBtn.className = 'view-btn';\n      viewBtn.dataset.sessionId = s.id;\n      viewBtn.textContent = s.id === viewer.watching ? '보는 중' : '열기';\n      viewBtn.disabled = s.id === viewer.watching;\n      viewBtn.addEventListener('click', () => {\n        openViewer(s.id, s.title || '세션');\n        renderWorkspaces(lastWorkspaces, lastResource); // \"보는 중\" 배지 갱신\n      });\n      li.appendChild(viewBtn);\n      li.addEventListener('click', (event) => {\n        if (!event.target.closest('button')) viewBtn.click();\n      });\n    } else if (!s.id) {\n      // 표시 전용 — 이 워크스페이스로 전환해야 볼 수 있다.\n      const note = document.createElement('span');\n      note.className = 'view-note';\n      note.textContent = ws.state === 'warm' ? '대기' : '절전';\n      li.appendChild(note);\n    }\n    return li;\n  }\n\n  // P3: iOS 설치 안내 — iOS Safari이고 아직 설치(standalone) 전일 때만 노출. 닫으면 억제한다.\n  function maybeShowIosInstallHint() {\n    const el = document.getElementById('ios-install');\n    if (!el) return;\n    // iPadOS 13+는 기본 \"데스크톱 사이트 요청\"으로 UA가 macOS로 위장한다 — UA만 보면 대다수\n    // iPad를 놓친다. MacIntel + 멀티터치를 보조 판별로 더해 iPad를 잡는다(P3 리뷰).\n    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent)\n      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);\n    const standalone = window.matchMedia('(display-mode: standalone)').matches\n      || window.navigator.standalone === true;\n    if (!isIos || standalone || localStorage.getItem(IOS_HINT_KEY)) return;\n    el.hidden = false;\n    const close = document.getElementById('ios-install-close');\n    if (close) {\n      close.addEventListener('click', () => {\n        el.hidden = true;\n        localStorage.setItem(IOS_HINT_KEY, '1');\n      });\n    }\n  }\n\n  // P4: 알림 권한 유도 + 웹푸시 구독 — 앱 아이콘 뱃지(iOS 설치형)·푸시는 알림 권한 승인 후에만\n  // 동작한다. 권한이 아직 미결정(default)일 때만 버튼을 노출한다. 같은 클릭 제스처 안에서\n  // 권한 요청 → 허용 시 pushManager.subscribe → 서버 등록(POST)까지 이어간다.\n  function maybeShowNotifyButton() {\n    const btn = document.getElementById('notify-enable');\n    if (!btn) return;\n    if (!('Notification' in window) || Notification.permission !== 'default') return;\n    btn.hidden = false;\n    btn.addEventListener('click', () => {\n      // iOS/WebKit은 사용자 제스처(클릭 핸들러) 안에서만 권한 요청을 허용한다.\n      requestNotificationPermission().then((permission) => {\n        btn.hidden = true;\n        if (permission === 'granted') enablePush(localStorage.getItem(TOKEN_KEY));\n      });\n    });\n  }\n\n  // 권한 요청을 Promise로 정규화한다 — iOS 16.4+는 Promise형, 구형 Safari는 콜백형.\n  function requestNotificationPermission() {\n    try {\n      const result = Notification.requestPermission();\n      if (result && typeof result.then === 'function') return result;\n      return new Promise((resolve) => {\n        Notification.requestPermission((perm) => resolve(perm));\n      });\n    } catch {\n      return Promise.resolve('denied');\n    }\n  }\n\n  // P4: 웹푸시 구독을 보장하고 서버에 등록한다. 권한이 이미 'granted'일 때 호출한다.\n  // iOS 제약: 웹푸시는 **홈 화면 설치형(standalone) + 사용자 제스처 + iOS 16.4+** 에서만\n  // 동작한다. 데스크톱 알림(notify-rust)과는 중복 억제하지 않는다(다른 기기).\n  async function enablePush(token) {\n    if (!token) return;\n    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;\n    try {\n      const reg = await navigator.serviceWorker.ready;\n      let sub = await reg.pushManager.getSubscription();\n      if (!sub) {\n        // VAPID 공개키를 서버에서 받아 구독한다(applicationServerKey).\n        const res = await fetch('/push/vapid?token=' + encodeURIComponent(token));\n        if (!res.ok) return; // 푸시 비활성(키 없음) — 조용히 종료\n        const body = await res.json();\n        if (!body || !body.key) return;\n        sub = await reg.pushManager.subscribe({\n          userVisibleOnly: true,\n          applicationServerKey: urlBase64ToUint8Array(body.key),\n        });\n      }\n      const json = sub.toJSON(); // { endpoint, keys: { p256dh, auth } }\n      if (!json || !json.endpoint || !json.keys) return;\n      await fetch('/push/subscribe?token=' + encodeURIComponent(token), {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ endpoint: json.endpoint, keys: json.keys }),\n      });\n    } catch {\n      // 구독 실패(권한/브라우저 제약)는 무시 — 다음 방문에 재시도한다.\n    }\n  }\n\n  // base64url VAPID 공개키를 pushManager가 요구하는 Uint8Array로 변환한다.\n  function urlBase64ToUint8Array(base64Url) {\n    const padding = '='.repeat((4 - (base64Url.length % 4)) % 4);\n    const base64 = (base64Url + padding).replace(/-/g, '+').replace(/_/g, '/');\n    const raw = atob(base64);\n    const out = new Uint8Array(raw.length);\n    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);\n    return out;\n  }\n\n  // 탭 백그라운드 시 스트림 정지(서버 접속 종료 → 0연결 예산 준수). 포그라운드 복귀 시 재연결.\n  function projectVisibility() {\n    if (document.hidden) {\n      setPrivacyCurtain(true);\n      setViewerConnection('paused');\n      disconnect();\n      setStatus('', '일시정지(백그라운드)');\n    } else {\n      setPrivacyCurtain(false);\n      setViewerConnection('connecting');\n      connect();\n    }\n  }\n\n  document.addEventListener('visibilitychange', projectVisibility);\n  if (document.hidden) projectVisibility();\n  else connect();\n})();\n<\/script>\n<\/body>\n<\/html>\n";
const descriptions={terminal:'기본 글자를 축소하지 않고 15px로 표시합니다. 긴 출력은 가로로 이동하거나 읽기 줄바꿈으로 볼 수 있습니다.',list:'활성 워크스페이스의 세션을 열 수 있습니다. 대기·절전 워크스페이스는 이어서 작업으로 전환합니다.',composer:'긴 지시는 작성 모드에서 입력합니다. 터미널 직접 입력과 초안 작성은 별도 동작입니다.',settings:'글자 크기 12–24px, 전체 화면 맞춤, 읽기 줄바꿈, 검색·복사와 휴대폰 크기 제어가 실제 메뉴에 있습니다.',reading:'원래 셀 배치 대신 긴 출력을 줄바꿈해서 읽는 모드입니다. 좌표 기반 TUI 조작은 터미널 모드에서 합니다.',keyboard:'키보드가 차지하는 284px 영역을 가정한 예시입니다. 실제 기기의 키보드 모양과 높이는 다를 수 있습니다.',reconnect:'연결이 끊긴 동안 상태를 표시하고 입력을 잠급니다. 다른 시나리오를 선택하면 예시 연결을 복구합니다.'};
document.querySelectorAll('[data-scenario]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('caption').textContent=descriptions[button.dataset.scenario];preview.contentWindow.postMessage({scenario:button.dataset.scenario},'*');}));
document.getElementById('size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');preview.style.width=w+'px';preview.style.height=h+'px';});
let sent=0;window.addEventListener('message',e=>{if(e.source===preview.contentWindow&&e.data?.preview&&e.data.input)document.getElementById('sent').textContent='예시 입력 '+(++sent)+'회';});
</script></body></html>
